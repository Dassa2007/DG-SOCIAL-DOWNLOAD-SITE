<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#05060b">
<title>DG SAVER — Premium Media Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05060b;
  --bg-2:#0a0d17;
  --card:rgba(14,18,32,.7);
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.12);
  --txt:#eef2fb;
  --mut:#8a94ad;
  --txt-dim:#5a637c;
  --p1:#7c5cff;
  --p2:#00d9ff;
  --p3:#ff4d8d;
  --ok:#22c55e;
  --err:#ff4d6a;
  --brand:#7c5cff;
}
html,body{height:100%}
body{
  font-family:'Inter','Noto Sans Sinhala',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--txt);
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  padding:20px 16px 36px;
  position:relative;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============ AURORA BG ============ */
.aurora{
  position:fixed;
  border-radius:50%;
  filter:blur(110px);
  pointer-events:none;
  z-index:0;
  will-change:transform;
}
.aurora-1{width:400px;height:400px;background:radial-gradient(circle,#7c5cff 0%,transparent 70%);top:-140px;left:-120px;opacity:.55;animation:float1 16s ease-in-out infinite}
.aurora-2{width:380px;height:380px;background:radial-gradient(circle,#00d9ff 0%,transparent 70%);bottom:-160px;right:-130px;opacity:.42;animation:float2 18s ease-in-out infinite}
.aurora-3{width:300px;height:300px;background:radial-gradient(circle,#ff4d8d 0%,transparent 70%);top:45%;left:50%;opacity:.14;transform:translate(-50%,-50%);animation:pulse 12s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,60px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-50px)}}
@keyframes pulse{0%,100%{opacity:.1;transform:translate(-50%,-50%) scale(1)}50%{opacity:.22;transform:translate(-50%,-50%) scale(1.15)}}

.wrap{
  position:relative;
  z-index:1;
  width:100%;
  max-width:640px;
  margin:0 auto;
  flex:1;
  display:flex;
  flex-direction:column;
}

/* ============ HEADER ============ */
header{text-align:center;margin:14px 0 26px}
.logo{
  display:inline-flex;
  align-items:center;
  gap:12px;
  font-size:26px;
  font-weight:900;
  letter-spacing:-.6px;
}
.logo-icon{
  width:44px;height:44px;
  border-radius:13px;
  background:linear-gradient(135deg,#7c5cff 0%,#4d8dff 50%,#00d9ff 100%);
  display:grid;place-items:center;
  color:#fff;
  box-shadow:0 10px 30px rgba(124,92,255,.55),0 0 0 1px rgba(255,255,255,.1) inset,0 1px 0 rgba(255,255,255,.25) inset;
  position:relative;
  overflow:hidden;
}
.logo-icon svg{width:22px;height:22px;position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.logo-icon::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.35) 0%,transparent 45%);
  pointer-events:none;
}
.logo-text{display:inline-flex;align-items:baseline;gap:1px}
.logo-text span{
  background:linear-gradient(90deg,#ff0055,#ffcc00,#00ff88,#00aaff,#aa00ff,#ff0055);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:rgbFlow 6s linear infinite;
}
@keyframes rgbFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.tagline{color:var(--mut);font-size:13px;margin-top:10px;font-weight:500;letter-spacing:.1px}

/* ============ CARD ============ */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:
    0 24px 60px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.03) inset,
    0 1px 0 rgba(255,255,255,.07) inset;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,92,255,.6),rgba(0,217,255,.6),transparent);
  pointer-events:none;
}

/* ============ PLATFORM GRID ============ */
.platform-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:16px;
}
.pbtn{
  --brand:#7c5cff;
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 4px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  cursor:pointer;
  font-family:inherit;
  color:var(--mut);
  transition:all .22s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
  isolation:isolate;
}
.pbtn .picon{
  position:relative;
  width:24px;height:24px;
  display:grid;place-items:center;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  color:var(--brand);
}
.pbtn .picon svg{width:100%;height:100%;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.pbtn .picon .badge-note,
.pbtn .picon .badge-hd{
  position:absolute;
  bottom:-3px;right:-6px;
  font-style:normal;
  font-size:8px;
  font-weight:900;
  background:#ff0033;
  color:#fff;
  padding:1px 4px;
  border-radius:4px;
  line-height:1;
  letter-spacing:.3px;
  box-shadow:0 2px 6px rgba(255,0,51,.5);
  border:1px solid rgba(255,255,255,.25);
}
.pbtn .plabel{
  font-size:10px;
  font-weight:800;
  letter-spacing:.2px;
  text-align:center;
  line-height:1.15;
  transition:color .2s;
}
.pbtn:hover{
  background:rgba(255,255,255,.06);
  color:#fff;
  transform:translateY(-2px);
  border-color:var(--line-2);
}
.pbtn:hover .picon{transform:scale(1.15) rotate(-4deg)}
.pbtn:active{transform:translateY(0) scale(.97)}
.pbtn.active{
  color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 22%,transparent),color-mix(in srgb,var(--brand) 8%,transparent));
  border-color:color-mix(in srgb,var(--brand) 55%,transparent);
  box-shadow:
    0 6px 22px color-mix(in srgb,var(--brand) 35%,transparent),
    0 0 0 1px color-mix(in srgb,var(--brand) 20%,transparent) inset;
}
.pbtn.active::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#ff0055,#ffcc00,#00ff88,#00aaff,#aa00ff,#ff0055);
  background-size:300% 100%;
  animation:rgbFlow 3s linear infinite;
  z-index:2;
}
.pbtn.active .picon{color:var(--brand)}

/* ============ FIELD ============ */
.field{position:relative;display:flex;align-items:center}
.field input{
  width:100%;
  background:rgba(6,9,18,.9);
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px 96px 17px 46px;
  color:var(--txt);
  font-size:14.5px;
  outline:none;
  font-family:inherit;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  letter-spacing:.1px;
}
.field input::placeholder{color:#545c74}
.field input:focus{
  border-color:rgba(124,92,255,.65);
  box-shadow:
    0 0 0 4px rgba(124,92,255,.14),
    0 0 32px rgba(124,92,255,.22);
  background:rgba(6,9,18,1);
}
.field .ico{
  position:absolute;
  left:15px;
  width:18px;height:18px;
  color:#a99bff;
  opacity:.75;
  pointer-events:none;
  transition:opacity .25s;
}
.field input:focus ~ .ico{opacity:1}
.field .tools{
  position:absolute;
  right:8px;
  display:flex;
  gap:4px;
}
.mini{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  color:var(--mut);
  font-size:10px;
  font-weight:800;
  padding:8px 10px;
  border-radius:10px;
  cursor:pointer;
  letter-spacing:.6px;
  font-family:inherit;
  display:inline-flex;
  align-items:center;
  gap:4px;
  transition:all .18s;
  height:30px;
}
.mini svg{width:11px;height:11px}
.mini:hover{background:rgba(255,255,255,.13);color:#fff;transform:translateY(-1px)}
.mini:active{transform:scale(.95)}
.mini-x{padding:8px 9px}
.mini-x:hover{background:rgba(255,77,106,.2);color:#ff8fa3;border-color:rgba(255,77,106,.4)}

/* ============ QUALITY ============ */
.quality-row{
  display:none;
  margin-top:12px;
  padding:12px 14px;
  background:linear-gradient(135deg,rgba(124,92,255,.1),rgba(0,217,255,.05));
  border:1px solid rgba(124,92,255,.22);
  border-radius:14px;
}
.quality-row.show{display:block;animation:up .3s ease}
.qlabel{
  font-size:10.5px;
  font-weight:800;
  color:#b8adff;
  letter-spacing:1.2px;
  text-transform:uppercase;
  margin-bottom:10px;
}
.quality-chips{display:flex;gap:6px;flex-wrap:wrap}
.qchip{
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--mut);
  font-size:11.5px;
  font-weight:700;
  padding:8px 14px;
  border-radius:10px;
  cursor:pointer;
  font-family:inherit;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.qchip:hover{color:#fff;background:rgba(255,255,255,.1);border-color:var(--line-2)}
.qchip:active{transform:scale(.95)}
.qchip.active{
  color:#fff;
  border-color:rgba(124,92,255,.65);
  background:linear-gradient(135deg,var(--p1),#4d8dff);
  box-shadow:0 4px 14px rgba(124,92,255,.45);
}

/* ============ MAIN BUTTON ============ */
.btn-wrap{
  position:relative;
  margin-top:14px;
  border-radius:18px;
  isolation:isolate;
}
.btn-wrap::before{
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:20px;
  background:conic-gradient(from 0deg,#ff0055,#ffcc00,#00ff88,#00aaff,#aa00ff,#ff0055);
  animation:hueSpin 5s linear infinite;
  z-index:0;
  opacity:.55;
  filter:blur(10px);
  transition:opacity .3s;
}
.btn-wrap:hover::before{opacity:.9}
@keyframes hueSpin{
  from{filter:blur(10px) hue-rotate(0deg)}
  to{filter:blur(10px) hue-rotate(360deg)}
}
.btn{
  position:relative;
  z-index:1;
  width:100%;
  padding:18px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#7c5cff 0%,#4d8dff 50%,#00d9ff 100%);
  color:#fff;
  font-size:16px;
  font-weight:800;
  letter-spacing:.3px;
  cursor:pointer;
  font-family:inherit;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  overflow:hidden;
  box-shadow:
    0 12px 32px rgba(91,61,245,.5),
    0 1px 0 rgba(255,255,255,.35) inset,
    0 -6px 20px rgba(0,0,0,.25) inset;
  transition:transform .15s cubic-bezier(.4,0,.2,1), box-shadow .25s;
}
.btn::after{
  content:'';
  position:absolute;
  top:0;left:-120%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-25deg);
  transition:left .7s cubic-bezier(.4,0,.2,1);
}
.btn:hover::after{left:130%}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(91,61,245,.65),0 1px 0 rgba(255,255,255,.4) inset}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-icon{display:inline-flex;width:20px;height:20px;transition:transform .3s}
.btn-icon svg{width:100%;height:100%}
.btn:hover .btn-icon{transform:translateY(2px)}
.btn.loading .btn-icon{animation:bounceY .9s ease-in-out infinite}
@keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* ============ STATUS ============ */
#status{margin-top:16px;display:none}
#status.show{display:block;animation:up .3s ease}
.box{
  border-radius:14px;
  padding:14px 16px;
  font-size:13.5px;
  display:flex;
  align-items:center;
  gap:11px;
  line-height:1.5;
  font-weight:500;
}
.box.load{
  background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(0,217,255,.08));
  border:1px solid rgba(124,92,255,.35);
  color:#d2cbff;
}
.box.err{
  background:linear-gradient(135deg,rgba(255,77,106,.15),rgba(255,77,106,.05));
  border:1px solid rgba(255,77,106,.4);
  color:#ffb8c4;
}
.spinner{
  width:16px;height:16px;flex:none;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.18);
  border-top-color:#b8adff;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ RESULT ============ */
#result{margin-top:20px;display:none}
#result.show{display:block;animation:up .4s ease}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.thumb{
  position:relative;
  width:100%;
  border-radius:18px;
  overflow:hidden;
  background:#0d1220;
  aspect-ratio:16/9;
  border:1px solid var(--line);
  box-shadow:0 16px 40px rgba(0,0,0,.5);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.thumb:hover img{transform:scale(1.04)}
.thumb .dur{
  position:absolute;bottom:10px;right:10px;
  background:rgba(0,0,0,.78);
  padding:5px 10px;
  border-radius:8px;
  font-size:11.5px;
  font-weight:800;
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.15);
  letter-spacing:.3px;
}
.meta{margin-top:16px}
.meta h2{font-size:15.5px;font-weight:700;line-height:1.45;margin-bottom:7px;letter-spacing:-.1px}
.meta .author{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;font-weight:500}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:16px;
}
.stat{
  background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 6px;
  text-align:center;
  transition:all .2s;
}
.stat:hover{border-color:var(--line-2);transform:translateY(-2px)}
.stat b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}
.stat small{
  font-size:9.5px;
  color:var(--mut);
  letter-spacing:1px;
  font-weight:800;
  text-transform:uppercase;
  margin-top:3px;
  display:block;
}

.sec-title{
  font-size:11px;
  font-weight:800;
  color:var(--mut);
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:22px 0 12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.sec-title::after{
  content:'';
  flex:1;
  height:1px;
  background:linear-gradient(90deg,var(--line),transparent);
}

/* ============ DOWNLOAD ROW ============ */
.dl{
  display:flex;
  align-items:center;
  gap:13px;
  background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px 15px;
  margin-bottom:9px;
  text-decoration:none;
  color:var(--txt);
  transition:all .25s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
  cursor:pointer;
  isolation:isolate;
}
.dl::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:linear-gradient(180deg,#7c5cff,#00d9ff);
  opacity:0;
  transition:opacity .25s;
  z-index:1;
}
.dl::after{
  content:'';
  position:absolute;
  top:0;left:-120%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
  transition:left .6s;
  pointer-events:none;
}
.dl:hover{
  background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(0,217,255,.08));
  border-color:rgba(124,92,255,.45);
  transform:translateX(4px);
  box-shadow:0 10px 30px rgba(124,92,255,.22);
}
.dl:hover::before{opacity:1}
.dl:hover::after{left:130%}
.dl:active{transform:translateX(4px) scale(.985)}
.dl .badge{
  width:42px;height:42px;flex:none;
  border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(124,92,255,.3),rgba(0,217,255,.18));
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  transition:transform .3s;
  position:relative;
  z-index:1;
}
.dl .badge svg{width:20px;height:20px}
.dl:hover .badge{transform:scale(1.08) rotate(-3deg)}
.dl .txt{flex:1;min-width:0;position:relative;z-index:1}
.dl .txt b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.1px;margin-bottom:2px}
.dl .txt small{font-size:11px;color:var(--mut);font-weight:500}
.dl .go{
  font-size:10.5px;
  font-weight:900;
  color:#fff;
  padding:7px 12px;
  border-radius:9px;
  background:linear-gradient(135deg,#7c5cff,#4d8dff);
  flex:none;
  letter-spacing:.8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  box-shadow:0 4px 14px rgba(124,92,255,.4);
  transition:all .2s;
  position:relative;
  z-index:1;
}
.dl .go svg{width:11px;height:11px}
.dl:hover .go{box-shadow:0 6px 20px rgba(124,92,255,.65);transform:translateY(-1px)}
.dl.downloading{pointer-events:none;opacity:.7}
.dl.downloading .go{background:linear-gradient(135deg,#22c55e,#16a34a)}

/* ============ FOOTER ============ */
footer{
  text-align:center;
  font-size:11px;
  color:#4d566e;
  margin-top:34px;
  line-height:1.8;
  font-weight:500;
}
.footer-logo{
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:6px;
  background:linear-gradient(90deg,#7c5cff,#00d9ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

/* ============ TOAST ============ */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:rgba(14,18,32,.95);
  border:1px solid rgba(124,92,255,.4);
  color:#fff;
  padding:12px 20px;
  border-radius:14px;
  font-size:13px;
  font-weight:600;
  z-index:9999;
  backdrop-filter:blur(20px);
  box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 24px rgba(124,92,255,.3);
  opacity:0;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  display:flex;
  align-items:center;
  gap:9px;
  max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:#22c55e;flex:none}
</style>
</head>
<body>

<div class="aurora aurora-1"></div>
<div class="aurora aurora-2"></div>
<div class="aurora aurora-3"></div>

<div class="wrap">

  <!-- ============ HEADER ============ -->
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </div>
      <div class="logo-text">DG<span>SAVER</span></div>
    </div>
    <p class="tagline">Premium downloads · හැම social media එකකින්ම</p>
  </header>

  <!-- ============ MAIN CARD ============ -->
  <div class="card">

    <!-- Platform Grid -->
    <div class="platform-grid" id="platformGrid">

function fmtNum(n){
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace('.0','') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.0','') + 'M';

  return String(n);
}

}

    rowEl.classList.add('downloading');
    const go = rowEl.querySelector('.go');
    if (go) go.innerHTML = '<div class="spinner" style="width:11px;height:11px;border-width:2px"></div><span>WAIT</span>';
  }

  // Attempt 1: blob fetch (true direct download)
  try {
    const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    toast('Download ආරම්භ වුණා ✓', true);
    if (rowEl) {
      rowEl.classList.remove('downloading');
      const go = rowEl.querySelector('.go');
      if (go) go.innerHTML = SVG_ARROW + '<span>GET</span>';
    }
    return;
  } catch(_) { /* fall through */ }

  // Attempt 2: anchor click fallback
  try {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Download ආරම්භ වුණා ✓', true);
  } catch(e) {
    toast('Download fail — link එක copy කරගන්න', false);
  } finally {
    if (rowEl) {
      rowEl.classList.remove('downloading');
      const go = rowEl.querySelector('.go');
      if (go) go.innerHTML = SVG_ARROW + '<span>GET</span>';
    }
  }
}

}

/* ============ MAIN CALL ============ */
async function callApi(platformKey, url){
  const p = PLATFORMS[platformKey];
  if (!p) throw new Error('මේ platform එක support කරන්නේ නෑ');

  if (p.method === 'CUSTOM_TIKTOK')       return await callTikTokApi(url);
  if (p.method === 'KCEY_SOCIAL')         return await callKceySocial(p.type, url);
  if (p.method === 'YTMP3_FALLBACK')      return await callYtmp3WithFallback(url);
  if (p.method === 'SASA_FALLBACK_YTMP4') return await callSasaYtmp4Api(url, currentQuality);
  if (p.method === 'SASA')                return await callSasaPinterestApi(url);
  if (p.method === 'DARKSHAN')            return await callDarkshanSpotify(url);

  throw new Error('Unknown method: ' + p.method);
}

/* ============ AUTO-DETECT ============ */
function autoDetect(url){
  if (/(youtube\.com|youtu\.be)/i.test(url)) {
    if (currentPlatform !== 'ytmp3' && currentPlatform !== 'ytmp4') setPlatform('ytmp3');
    return;
  }
  for (const [key, p] of Object.entries(PLATFORMS)) {
    if (key === 'ytmp3' || key === 'ytmp4') continue;
    if (p.pattern.test(url)) { setPlatform(key); return; }
  }
}
input.addEventListener('input', () => {
  const url = input.value.trim();
  if (url.length > 8) autoDetect(url);
});

/* ============ MAIN HANDLER ============ */
async function handleFetch(){
  const url = input.value.trim();
  if (!url) { showStatus('error', 'කරුණාකර link එකක් ඇතුළත් කරන්න'); input.focus(); return; }
  if (!/^https?:\/\//i.test(url)) { showStatus('error', 'Link එක https:// වලින් පටන් ගන්න ඕනේ'); return; }

  autoDetect(url);
  resultEl.className = '';
  resultEl.innerHTML = '';
  showStatus('loading', `${PLATFORMS[currentPlatform].label} එක සොයමින්... ටිකක් ඉන්න`);
  setLoading(true);

  try {
    const data = await callApi(currentPlatform, url);
    showStatus('none');
    PLATFORMS[currentPlatform].render(data);
  } catch (err) {
    showStatus('error', err.message || 'මොකක්හරි වැරැද්දක් වුණා. ආයෙ උත්සාහ කරන්න');
  } finally {
    setLoading(false);
  }
}

/* ============ EVENTS ============ */
fetchBtn.addEventListener('click', handleFetch);
input.addEventListener('keydown', e => { if (e.key === 'Enter') handleFetch(); });
pasteBtn.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) { input.value = text.trim(); autoDetect(input.value); input.focus(); }
  } catch { input.focus(); showStatus('error', 'Clipboard කියවන්න බෑ — අතින් paste කරන්න'); }
});
clearBtn.addEventListener('click', () => {
  input.value = ''; input.focus();
  resultEl.className = ''; resultEl.innerHTML = '';
  showStatus('none');
});

/* ============ INIT ============ */
setPlatform('facebook');
</script>
