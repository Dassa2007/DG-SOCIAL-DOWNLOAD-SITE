<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT MP3 Downloader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 50%, #1a1a2e 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #fff;
  }
  .container {
    width: 100%; max-width: 480px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px; padding: 32px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo { text-align: center; margin-bottom: 8px; font-size: 42px; }
  h1 {
    text-align: center; font-size: 22px; margin-bottom: 6px;
    background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; font-weight: 800;
  }
  .subtitle { text-align: center; font-size: 12px; color: #888; margin-bottom: 28px; }
  input[type="text"] {
    width: 100%; padding: 16px 18px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; color: #fff; font-size: 14px;
    outline: none; transition: all 0.3s; margin-bottom: 16px;
  }
  input[type="text"]:focus {
    border-color: #8338ec;
    box-shadow: 0 0 0 3px rgba(131,56,236,0.2);
  }
  input::placeholder { color: #666; }
  button {
    width: 100%; padding: 16px;
    background: linear-gradient(90deg, #ff006e, #8338ec);
    border: none; border-radius: 14px;
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(131,56,236,0.4); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { margin-top: 20px; padding: 14px; border-radius: 12px; font-size: 13px; text-align: center; display: none; }
  .status.loading { display: block; background: rgba(58,134,255,0.15); color: #3a86ff; }
  .status.error { display: block; background: rgba(255,0,110,0.15); color: #ff006e; }
  .status.success { display: block; background: rgba(0,200,100,0.15); color: #00c864; }
  .loader {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result {
    margin-top: 20px; padding: 18px;
    background: rgba(0,0,0,0.3); border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1); display: none;
  }
  .result.show { display: block; animation: slideIn 0.3s; }
  @keyframes slideIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform: translateY(0);} }
  .result img { width: 100%; border-radius: 10px; margin-bottom: 12px; }
  .result .title { font-size: 14px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; }
  .download-btn {
    display: block; text-align: center; padding: 14px;
    background: linear-gradient(90deg, #00c864, #00a854);
    color: #fff; text-decoration: none;
    border-radius: 12px; font-weight: 700; font-size: 14px; margin-bottom: 8px;
  }
  .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #555; }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">🎵</div>
    <h1>YT MP3 Downloader</h1>
    <p class="subtitle">YouTube link එක paste කරලා MP3 download කරගන්න</p>

    <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=..." />
    <button id="downloadBtn">Download MP3</button>

    <div class="status" id="status"></div>

    <div class="result" id="result">
      <img id="thumb" src="" alt="thumbnail" />
      <div class="title" id="videoTitle"></div>
      <a id="downloadLink" class="download-btn" href="#" target="_blank">⬇️ Download MP3</a>
    </div>

    <div class="footer">Powered by Dark Shans API</div>
  </div>

<script>
  // ✅ දැන් local proxy එකට call කරනවා (CORS ප්‍රශ්නය නැහැ)
  const API_URL = "/api/ytmp3";

  const urlInput = document.getElementById('urlInput');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const thumbEl = document.getElementById('thumb');
  const videoTitleEl = document.getElementById('videoTitle');
  const downloadLinkEl = document.getElementById('downloadLink');

  function setStatus(type, message, showLoader = false) {
    statusEl.className = 'status ' + type;
    statusEl.innerHTML = showLoader ? `<span class="loader"></span>${message}` : message;
  }

  function extractVideoId(url) {
    const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
    return null;
  }

  function findUrl(obj, depth = 0) {
    if (depth > 6 || !obj) return null;
    if (typeof obj === 'string') return /^https?:\/\//i.test(obj) ? obj : null;
    if (Array.isArray(obj)) {
      for (const item of obj) { const r = findUrl(item, depth + 1); if (r) return r; }
      return null;
    }
    if (typeof obj === 'object') {
      const keys = ['download_url','downloadUrl','url','link','audio','mp3','file'];
      for (const k of keys) {
        if (typeof obj[k] === 'string' && /^https?:\/\//i.test(obj[k])) return obj[k];
      }
      for (const k of Object.keys(obj)) { const r = findUrl(obj[k], depth + 1); if (r) return r; }
    }
    return null;
  }

  function findField(obj, keys, depth = 0) {
    if (depth > 6 || !obj || typeof obj !== 'object') return null;
    for (const k of keys) if (obj[k]) return obj[k];
    for (const k of Object.keys(obj)) {
      const r = findField(obj[k], keys, depth + 1); if (r) return r;
    }
    return null;
  }

  async function downloadMp3() {
    const rawUrl = urlInput.value.trim();
    if (!rawUrl) { setStatus('error', '❌ YouTube link එකක් දාන්න'); return; }

    const videoId = extractVideoId(rawUrl);
    if (!videoId) { setStatus('error', '❌ වලංගු YouTube link එකක් නෙවෙයි'); return; }

    resultEl.classList.remove('show');
    downloadBtn.disabled = true;
    setStatus('loading', 'MP3 එක හදනවා... ටිකක් ඉන්න', true);

    try {
      const res = await fetch(`${API_URL}?url=${encodeURIComponent(rawUrl)}`);
      const data = await res.json();
      console.log('Response:', data);

      if (data.error) throw new Error(data.error);

      const dlUrl = findUrl(data);
      const title = findField(data, ['title','video_title','name','fileName']) || 'YouTube Audio';
      const thumb = findField(data, ['thumbnail','thumb','image','cover']) ||
                    `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

      if (!dlUrl) throw new Error('Download link එක හම්බුනේ නැහැ');

      thumbEl.src = thumb;
      videoTitleEl.textContent = title;
      downloadLinkEl.href = dlUrl;
      resultEl.classList.add('show');
      setStatus('success', '✅ සාර්ථක! පහල Download button එක ඔබන්න');
    } catch (err) {
      console.error(err);
      setStatus('error', '❌ ' + err.message);
    } finally {
      downloadBtn.disabled = false;
    }
  }

  downloadBtn.addEventListener('click', downloadMp3);
  urlInput.addEventListener('keypress', e => { if (e.key === 'Enter') downloadMp3(); });
</script>
</body>
</html>
