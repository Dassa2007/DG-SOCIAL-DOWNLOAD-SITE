<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech With Dasun - YouTube Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #334155;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .brand {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            background: #e11d48;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover {
            background: #be123c;
        }
        button:active {
            transform: scale(0.98);
        }
        .loading {
            margin-top: 20px;
            color: #fbbf24;
            font-size: 14px;
        }
        .result {
            margin-top: 20px;
            text-align: left;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            display: none;
        }
        .result img {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .result h3 {
            font-size: 15px;
            margin-bottom: 15px;
            color: #f1f5f9;
            line-height: 1.4;
        }
        .dl-btn {
            display: block;
            background: #10b981;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 8px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        .dl-btn:hover {
            background: #059669;
        }
        .error {
            color: #f87171;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>YouTube Downloader</h2>
        <div class="brand">Tech With Dasun & DG STORE</div>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="YouTube Link එක මෙතනට Paste කරන්න...">
            <button onclick="getDownloadLinks()">Download ගන්න</button>
        </div>

        <div id="loadingArea" class="loading" style="display: none;">වීඩියෝ විස්තර ලබාගනිමින් පවතී, රැඳී සිටින්න...</div>
        <div id="errorArea" class="error"></div>

        <div class="result" id="resultArea">
            <img id="thumb" src="" alt="Thumbnail">
            <h3 id="videoTitle"></h3>
            <div id="linksContainer"></div>
        </div>
    </div>

    <script>
        async function getDownloadLinks() {
            const urlInput = document.getElementById('urlInput');
            const loadingArea = document.getElementById('loadingArea');
            const errorArea = document.getElementById('errorArea');
            const resultArea = document.getElementById('resultArea');
            
            const url = urlInput ? urlInput.value.trim() : '';
            
            errorArea.innerHTML = "";
            resultArea.style.display = "none";

            if(!url) {
                errorArea.innerHTML = "කරුණාකර YouTube Link එකක් ඇතුළත් කරන්න!";
                return;
            }

            loadingArea.style.display = "block";

            const backendURL = `https://youtube-downloader-api-render.onrender.com/download?url=${encodeURIComponent(url)}`;

            try {
                const response = await fetch(backendURL);
                const data = await response.json();

                loadingArea.style.display = "none";

                if(data.success) {
                    document.getElementById('thumb').src = data.thumbnail;
                    document.getElementById('videoTitle').innerText = data.title;
                    
                    let linksHtml = "<strong>ලබා ගත හැකි තත්ත්වයන් (Qualities):</strong><br>";
                    
                    data.formats.forEach(f => {
                        if(f.quality) {
                            linksHtml += `<a class="dl-btn" href="${f.url}" target="_blank">Download (${f.quality} - ${f.container})</a>`;
                        }
                    });

                    document.getElementById('linksContainer').innerHTML = linksHtml;
                    resultArea.style.display = "block";
                } else {
                    errorArea.innerHTML = data.error || "වීඩියෝව ලබාගැනීමේදී දෝෂයක් සිදු විය.";
                }
            } catch (err) {
                loadingArea.style.display = "none";
                errorArea.innerHTML = "සර්වර් එක සමඟ සම්බන්ධ වීමට නොහැකි විය. කරුණාකර නැවත උත්සාහ කරන්න.";
            }
        }
    </script>
</body>
</html>
