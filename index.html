<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#070a12">
<title>Media Downloader</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#070a12;
    --card:rgba(20,26,42,.72);
    --line:rgba(255,255,255,.09);
    --txt:#e8ecf5;
    --mut:#8b95ad;
    --p1:#6d5efc;
    --p2:#00d4ff;
    --ok:#22c55e;
    --err:#ef4444;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Sinhala',sans-serif;
    background:var(--bg);color:var(--txt);
    min-height:100dvh;display:flex;flex-direction:column;
    padding:18px 16px 32px;position:relative;overflow-x:hidden;
  }
  /* background glows */
  body::before,body::after{
    content:'';position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;
    pointer-events:none;z-index:0;
  }
  body::before{width:320px;height:320px;background:#5b3df5;top:-120px;left:-100px}
  body::after{width:300px;height:300px;background:#00b4ff;bottom:-140px;right:-110px;opacity:.22}

  .wrap{position:relative;z-index:1;width:100%;max-width:640px;margin:0 auto;flex:1;display:flex;flex-direction:column}

  /* header */
  header{text-align:center;margin:14px 0 26px}
  .logo{
    display:inline-flex;align-items:center;gap:9px;
    font-size:21px;font-weight:800;letter-spacing:-.4px;
  }
  .logo .dot{
    width:32px;height:32px;border-radius:10px;
    background:linear-gradient(135deg,var(--p1),var(--p2));
    display:grid;place-items:center;font-size:17px;
    box-shadow:0 6px 20px rgba(109,94,252,.45);
  }
  .logo span.grad{
    background:linear-gradient(135deg,#a99bff,#5fe1ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--mut);font-size:13px;margin-top:8px}

  /* card */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:16px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 16px 44px rgba(0,0,0,.5);
  }

  .field{position:relative;display:flex;align-items:center;gap:8px}
  .field input{
    flex:1;min-width:0;
    background:rgba(8,12,22,.85);
    border:1px solid var(--line);
    border-radius:14px;
    padding:15px 74px 15px 44px;
    color:var(--txt);font-size:15px;outline:none;
    transition:border-color .2s, box-shadow .2s;
    font-family:inherit;
  }
  .field input::placeholder{color:#5c6580}
  .field input:focus{
    border-color:rgba(109,94,252,.7);
    box-shadow:0 0 0 3px rgba(109,94,252,.16);
  }
  .field .ico{
    position:absolute;left:15px;font-size:16px;opacity:.55;pointer-events:none;
  }
  .field .tools{
    position:absolute;right:8px;display:flex;gap:4px;
  }
  .mini{
    background:rgba(255,255,255,.07);border:none;color:var(--mut);
    font-size:11px;font-weight:700;padding:7px 10px;border-radius:9px;
    cursor:pointer;letter-spacing:.3px;font-family:inherit;
    transition:background .15s,color .15s;
  }
  .mini:active{background:rgba(255,255,255,.16);color:#fff}

  .btn{
    width:100%;margin-top:12px;
    padding:16px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--p1),#4d8dff 55%,var(--p2));
    color:#fff;font-size:16px;font-weight:800;letter-spacing:.2px;
    cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 10px 26px rgba(91,61,245,.4);
    transition:transform .12s, opacity .2s;
  }
  .btn:active{transform:scale(.975)}
  .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

  /* platform chips */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;justify-content:center}
  .chip{
    font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);color:var(--mut);
    background:rgba(255,255,255,.03);
  }
  .chip.on{
    color:#c9c1ff;border-color:rgba(109,94,252,.5);
    background:rgba(109,94,252,.14);
  }

  /* status */
  #status{margin-top:16px;display:none}
  #status.show{display:block}
  .box{
    border-radius:14px;padding:13px 15px;font-size:13.5px;
    display:flex;align-items:center;gap:10px;line-height:1.45;
  }
  .box.load{background:rgba(109,94,252,.12);border:1px solid rgba(109,94,252,.3);color:#c3bcff}
  .box.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#ffb3b3}
  .spinner{
    width:16px;height:16px;flex:none;border-radius:50%;
    border:2px solid rgba(255,255,255,.2);border-top-color:#a99bff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* result */
  #result{margin-top:18px;display:none}
  #result.show{display:block;animation:up .35s ease}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .thumb{
    position:relative;width:100%;border-radius:16px;overflow:hidden;
    background:#0d1220;aspect-ratio:16/9;
    border:1px solid var(--line);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .dur{
    position:absolute;bottom:9px;right:9px;
    background:rgba(0,0,0,.78);padding:4px 9px;border-radius:7px;
    font-size:11.5px;font-weight:700;backdrop-filter:blur(6px);
  }

  .meta{margin-top:14px}
  .meta h2{font-size:15px;font-weight:700;line-height:1.45;margin-bottom:6px}
  .meta .author{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}

  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;
  }
  .stat{
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:12px;padding:10px 6px;text-align:center;
  }
  .stat b{display:block;font-size:15px;font-weight:800}
  .stat small{font-size:10.5px;color:var(--mut);letter-spacing:.3px}

  .sec-title{
    font-size:11.5px;font-weight:800;color:var(--mut);
    letter-spacing:1.2px;text-transform:uppercase;
    margin:20px 0 10px;
  }

  .dl{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:9px;
    text-decoration:none;color:var(--txt);
    transition:background .15s,border-color .15s,transform .12s;
  }
  .dl:active{transform:scale(.985);background:rgba(109,94,252,.13);border-color:rgba(109,94,252,.4)}
  .dl .badge{
    width:40px;height:40px;flex:none;border-radius:11px;
    display:grid;place-items:center;font-size:17px;
    background:linear-gradient(135deg,rgba(109,94,252,.28),rgba(0,212,255,.2));
    border:1px solid rgba(255,255,255,.08);
  }
  .dl .txt{flex:1;min-width:0}
  .dl .txt b{display:block;font-size:14px;font-weight:700}
  .dl .txt small{font-size:11.5px;color:var(--mut)}
  .dl .go{
    font-size:11px;font-weight:800;color:#a99bff;
    padding:6px 10px;border-radius:8px;background:rgba(109,94,252,.15);
    flex:none;
  }

  footer{
    text-align:center;font-size:11.5px;color:#4d566e;
    margin-top:28px;line-height:1.7;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <div class="dot">⬇</div>
      <div>Media<span class="grad">Grab</span></div>
    </div>
    <p>Facebook, Instagram, TikTok, YouTube — එකම තැනකින්</p>
  </header>

  <div class="card">
    <div class="field">
      <span class="ico">🔗</span>
      <input id="urlInput" type="url" inputmode="url" autocomplete="off"
             spellcheck="false" placeholder="Video link එක මෙතන paste කරන්න...">
      <div class="tools">
        <button class="mini" id="pasteBtn" type="button">PASTE</button>
        <button class="mini" id="clearBtn" type="button">✕</button>
      </div>
    </div>

    <button class="btn" id="fetchBtn" type="button">
      <span id="btnIcon">⬇</span><span id="btnText">Download කරන්න</span>
    </button>

    <div class="chips">
      <div class="chip on" data-p="facebook">Facebook</div>
      <div class="chip" data-p="instagram">Instagram</div>
      <div class="chip" data-p="tiktok">TikTok</div>
      <div class="chip" data-p="youtube">YouTube</div>
    </div>
  </div>

  <div id="status"></div>
  <div id="result"></div>

  <footer>
    MediaGrab · Personal use සඳහා පමණි<br>
    සියලුම හිමිකම් අදාළ මුල් අයිතිකරුවන් සතුය
  </footer>

</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const PROXY_ENDPOINT = '/api/facebook';       // Vercel serverless function
const DIRECT_ENDPOINT = 'https://api.kcey.online/api/facebook';
const DIRECT_KEY = 'kcey_3aac11b6ed5c49a5b3b0a2a2922a38de4014'; // fallback (local test only)

/* =========================================================
   ELEMENTS
   ========================================================= */
const input    = document.getElementById('urlInput');
const fetchBtn = document.getElementById('fetchBtn');
const pasteBtn = document.getElementById('pasteBtn');
const clearBtn = document.getElementById('clearBtn');
const btnIcon  = document.getElementById('btnIcon');
const btnText  = document.getElementById('btnText');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

/* =========================================================
   PLATFORM DETECTION
   ========================================================= */
const PATTERNS = {
  facebook : /(facebook\.com|fb\.watch|fb\.me|m\.facebook\.com)/i,
  instagram: /(instagram\.com|instagr\.am)/i,
  tiktok   : /(tiktok\.com|vm\.tiktok\.com)/i,
  youtube  : /(youtube\.com|youtu\.be)/i
};

function detectPlatform(url){
  for (const [name, re] of Object.entries(PATTERNS)) {
    if (re.test(url)) return name;
  }
  return null;
}

/* =========================================================
   HELPERS
   ========================================================= */
function showStatus(type, msg){
  statusEl.className = 'show';
  if (type === 'loading') {
    statusEl.innerHTML = `<div class="box load"><div class="spinner"></div><div>${msg}</div></div>`;
  } else if (type === 'error') {
    statusEl.innerHTML = `<div class="box err"><div>⚠️</div><div>${msg}</div></div>`;
  } else {
    statusEl.className = '';
    statusEl.innerHTML = '';
  }
}

function setLoading(on){
  fetchBtn.disabled = on;
  btnIcon.textContent = on ? '⏳' : '⬇';
  btnText.textContent = on ? 'සොයමින්...' : 'Download කරන්න';
}

function fmtNum(n){
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace('.0','') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.0','') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace('.0','') + 'K';
  return String(n);
}

function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function qualityLabel(link){
  const q = String(link.quality || '').toLowerCase();
  const t = String(link.type || '').toLowerCase();

  if (q.includes('audio') || t.includes('audio'))
    return { icon:'🎵', title:'Audio Only', sub:'M4A · ශබ්දය පමණයි' };

  if (q === '360' || q.includes('360'))
    return { icon:'📱', title:'360p Video', sub:'Data අඩුවෙන් · MP4' };

  if (q === '720' || q.includes('720'))
    return { icon:'🎬', title:'720p HD', sub:'MP4 Video' };

  if (q === '1080' || q.includes('1080'))
    return { icon:'💎', title:'1080p Full HD', sub:'MP4 Video' };

  if (!q || q === 'video' || q === 'hd' || q.includes('hd'))
    return { icon:'⚡', title:'HD Video', sub:'Watermark රහිත · MP4' };

  return { icon:'🎞️', title:`Video ${esc(link.quality)}`, sub:'MP4 Video' };
}

/* =========================================================
   FETCH FROM API
   ========================================================= */
async function callApi(url){
  // 1) Try the Vercel proxy first (hides the key, no CORS issues)
  try {
    const r = await fetch(`${PROXY_ENDPOINT}?url=${encodeURIComponent(url)}`);
    if (r.ok) {
      const data = await r.json();
      if (data && typeof data === 'object') return data;
    }
  } catch (_) { /* fall through */ }

  // 2) Fallback: direct call (works when opening the file locally)
  const direct = `${DIRECT_ENDPOINT}?url=${encodeURIComponent(url)}&key=${DIRECT_KEY}`;
  const r2 = await fetch(direct);
  if (!r2.ok) throw new Error('API එකට සම්බන්ධ වෙන්න බැරි වුණා');
  return await r2.json();
}

/* =========================================================
   RENDER RESULT
   ========================================================= */
function renderFacebook(data){
  const md = data.metadata || {};
  const dl = data.downloads || {};
  const links = Array.isArray(dl.links) ? dl.links : [];

  const thumb = dl.thumbnail || '';
  const title = md.title || 'Facebook Video';

  let html = '';

  // thumbnail
  if (thumb) {
    html += `
      <div class="thumb">
        <img src="${esc(thumb)}" alt="thumbnail" referrerpolicy="no-referrer"
             onerror="this.parentElement.style.display='none'">
        ${md.duration ? `<div class="dur">${esc(md.duration)}</div>` : ''}
      </div>`;
  }

  // meta
  html += `<div class="meta">
    <h2>${esc(title)}</h2>
    <div class="author">👤 ${esc(md.author || 'Unknown')}</div>
  </div>`;

  // stats
  const stats = [];
  if (md.view_count)    stats.push({ n: fmtNum(md.view_count),    l:'VIEWS' });
  if (md.like_count)    stats.push({ n: fmtNum(md.like_count),    l:'LIKES' });
  if (md.comment_count) stats.push({ n: fmtNum(md.comment_count), l:'COMMENTS' });
  if (md.resolution)    stats.push({ n: esc(md.resolution),       l:'RESOLUTION' });

  if (stats.length) {
    html += `<div class="stats">` +
      stats.slice(0, 3).map(s =>
        `<div class="stat"><b>${s.n}</b><small>${s.l}</small></div>`
      ).join('') + `</div>`;
  }

  // downloads
  if (links.length) {
    html += `<div class="sec-title">Download Options</div>`;
    links.forEach(link => {
      if (!link || !link.url) return;
      const q = qualityLabel(link);
      html += `
        <a class="dl" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">
          <div class="badge">${q.icon}</div>
          <div class="txt">
            <b>${q.title}</b>
            <small>${q.sub}</small>
          </div>
          <div class="go">GET</div>
        </a>`;
    });
  } else {
    html += `<div class="box err" style="margin-top:14px">
      <div>⚠️</div><div>Download link කිසිවක් හමු නොවුණා</div></div>`;
  }

  resultEl.innerHTML = html;
  resultEl.className = 'show';
  resultEl.scrollIntoView({ behavior:'smooth', block:'start' });
}

/* =========================================================
   MAIN
   ========================================================= */
async function handleFetch(){
  const url = input.value.trim();

  if (!url) {
    showStatus('error', 'කරුණාකර video link එකක් ඇතුළත් කරන්න');
    input.focus();
    return;
  }
  if (!/^https?:\/\//i.test(url)) {
    showStatus('error', 'Link එක https:// වලින් පටන් ගන්න ඕනේ');
    return;
  }

  const platform = detectPlatform(url);
  if (!platform) {
    showStatus('error', 'මේ link එක හඳුනාගන්න බැරි වුණා. Facebook link එකක් උත්සාහ කරන්න');
    return;
  }
  if (platform !== 'facebook') {
    showStatus('error', `${platform} support තවම add කරලා නෑ — Facebook පමණයි දැනට`);
    return;
  }

  resultEl.className = '';
  resultEl.innerHTML = '';
  showStatus('loading', 'Video එක සොයමින්... ටිකක් ඉන්න');
  setLoading(true);

  try {
    const data = await callApi(url);

    if (!data || data.status === false) {
      throw new Error(data?.message || data?.error || 'Video එක හමු නොවුණා');
    }

    showStatus('none');
    renderFacebook(data);

  } catch (err) {
    showStatus('error', err.message || 'මොකක්හරි වැරැද්දක් වුණා. ආයෙ උත්සාහ කරන්න');
  } finally {
    setLoading(false);
  }
}

/* =========================================================
   EVENTS
   ========================================================= */
fetchBtn.addEventListener('click', handleFetch);

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleFetch();
});

pasteBtn.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      input.value = text.trim();
      input.focus();
    }
  } catch {
    input.focus();
    showStatus('error', 'Clipboard කියවන්න බෑ — අතින් paste කරන්න');
  }
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  input.focus();
  resultEl.className = '';
  resultEl.innerHTML = '';
  showStatus('none');
});

// live platform highlight
input.addEventListener('input', () => {
  const p = detectPlatform(input.value.trim());
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('on', c.dataset.p === p);
  });
});
</script>
</body>
</html>
