<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-top: 20px; }
        h2 { margin-bottom: 15px; color: #38bdf8; font-size: 24px; }
        .nav-tabs { display: flex; justify-content: space-around; background: #0f172a; padding: 8px; border-radius: 10px; margin-bottom: 20px; }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 14px; font-weight: bold; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: 0.3s; }
        .nav-btn.active { background: #38bdf8; color: #0f172a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }
        .action-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        button.dl-btn { flex: 1; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button.dl-btn.audio { background: #10b981; }
        #result { margin-top: 20px; word-break: break-all; text-align: left; }
        .result-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-top: 10px; }
        .result-box a { display: block; background: #e11d48; color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 6px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 All-in-One Downloader</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">YouTube, Facebook & Pinterest Downloader</p>

        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('youtube')">YouTube</button>
            <button class="nav-btn" onclick="switchTab('facebook')">Facebook</button>
            <button class="nav-btn" onclick="switchTab('pinterest')">Pinterest</button>
        </div>

        <div id="youtube" class="tab-content active">
            <input type="text" id="yt-url" placeholder="Paste YouTube Link here...">
            <div class="action-btns">
                <button class="dl-btn" onclick="startDownload('youtube')">📥 Download</button>
            </div>
        </div>

        <div id="facebook" class="tab-content">
            <input type="text" id="fb-url" placeholder="Paste Facebook Link here...">
            <div class="action-btns">
                <button class="dl-btn" onclick="startDownload('facebook')">📥 Download</button>
            </div>
        </div>

        <div id="pinterest" class="tab-content">
            <input type="text" id="pin-url" placeholder="Paste Pinterest Link here...">
            <div class="action-btns">
                <button class="dl-btn" onclick="startDownload('pinterest')">📥 Download</button>
            </div>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function switchTab(platform) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(platform).classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('result').innerHTML = '';
        }

        async function startDownload(platform) {
            const inputId = platform === 'youtube' ? 'yt-url' : (platform === 'facebook' ? 'fb-url' : 'pin-url');
            const url = document.getElementById(inputId).value.trim();
            const resultDiv = document.getElementById('result');

            if (!url) {
                alert("කරුණාකර වලංගු ලින්ක් එකක් ඇතුළත් කරන්න!");
                return;
            }

            resultDiv.innerHTML = `<p style="color: #38bdf8; text-align: center;">⏳ සකස් වෙමින් පවතී, රැඳී සිටින්න...</p>`;

            try {
                // Cobal API (නිදහස් සහ වේගවත් සේවාවක්) හරහා ලබා ගැනීම
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        vQuality: '720'
                    })
                });

                const data = await response.json();
                console.log("Response:", data);

                if (data && (data.url || data.picker)) {
                    let downloadLink = data.url;
                    
                    // එකකට වඩා වැඩි ලින්ක් තිබේ නම් පළමුවැන්න ගන්න
                    if(data.picker && data.picker.length > 0) {
                        downloadLink = data.picker[0].url;
                    }

                    let downloadHtml = `<div class="result-box">`;
                    downloadHtml += `<p><strong>အောင်မြင်යි!</strong> බාගත කරගැනීමට සූදානම්.</p>`;
                    downloadHtml += `<a href="${downloadLink}" target="_blank">Download File Now</a>`;
                    downloadHtml += `</div>`;
                    resultDiv.innerHTML = downloadHtml;
                } else {
                    resultDiv.innerHTML = `<p style="color: #e11d48; text-align: center;">❌ වීඩියෝව ලබා ගැනීමට නොහැකි විය. වෙනත් ලින්ක් එකක් උත්සාහ කරන්න.</p>`;
                }
            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = `<p style="color: #e11d48; text-align: center;">❌ සම්බන්ධ වීමේ දෝෂයක් සිදු විය.</p>`;
            }
        }
    </script>
</body>
</html>
