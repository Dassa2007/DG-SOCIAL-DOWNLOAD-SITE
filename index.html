<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Video Downloader - DG STORE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #e60023; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e60023;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #ad081b; }
        #result { margin-top: 20px; word-break: break-all; }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pinterest Downloader</h2>
        <input type="text" id="urlInput" placeholder="Pinterest ලින්ක් එක මෙතනට දාන්න...">
        <button onclick="downloadVideo()">Download</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function downloadVideo() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                resultDiv.innerHTML = "<p style='color:red;'>කරුණාකර Pinterest ලින්ක් එකක් ඇතුළත් කරන්න!</p>";
                return;
            }

            resultDiv.innerHTML = "<p>භාගත කරමින් පවතී, කරුණාකර රැඳී සිටින්න...</p>";

            try {
                // ඔයාගේ Render API එකට රික්වෙස්ට් එක යැවීම
                const response = await fetch(`https://pinterest-download-api-render.onrender.com/download?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.status && data.qualities) {
                    let html = "<h3>භාගත කිරීමේ ලින්ක්:</h3>";
                    for (const [quality, link] of Object.entries(data.qualities)) {
                        html += `<a href="${link}" class="download-btn" target="_blank">Download ${quality}</a><br>`;
                    }
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<p style='color:red;'>වීඩියෝව ලබා ගැනීමට නොහැකි විය. නිවැරදි ලින්ක් එකක් දමන්න.</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style='color:red;'>සර්වර් දෝෂයකි. පසුව උත්සාහ කරන්න.</p>`;
            }
        }
    </script>

</body>
</html>
