<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Social Download</title>
    <!-- FontAwesome Icons for Social Media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 90%;
            max-width: 480px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Animated Title */
        .brand-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #ff007f, #ff758c);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowText 5s ease infinite;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        @keyframes glowText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Social Icons Selector */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .social-icon {
            font-size: 22px;
            cursor: pointer;
            padding: 12px;
            border-radius: 50%;
            background: #1f2937;
            color: #9ca3af;
            transition: all 0.3s ease;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .social-icon:hover, .social-icon.active {
            transform: translateY(-5px);
            color: #fff;
        }
        .social-icon.tiktok.active { background: #000; color: #fe2c55; box-shadow: 0 0 15px #fe2c55; }
        .social-icon.pinterest.active { background: #e60023; color: #fff; box-shadow: 0 0 15px #e60023; }
        .social-icon.facebook.active { background: #1877f2; color: #fff; box-shadow: 0 0 15px #1877f2; }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #374151;
            border-radius: 10px;
            background: #111827;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #00f2fe;
        }
        input[type="text"]::placeholder {
            color: #6b7280;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            box-sizing: border-box;
        }
        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        /* Loading Animation */
        .loader {
            display: none;
            width: 35px;
            height: 35px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #00f2fe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #9ca3af;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Animated Name -->
        <div class="brand-title">DG SOCIAL DOWNLOAD</div>

        <!-- Social Icons (Touch to switch platform) -->
        <div class="social-icons">
            <div class="social-icon tiktok active" onclick="selectPlatform('tiktok', this)" title="TikTok Download"><i class="fa-brands fa-tiktok"></i></div>
            <div class="social-icon pinterest" onclick="selectPlatform('pinterest', this)" title="Pinterest Download"><i class="fa-brands fa-pinterest-p"></i></div>
            <div class="social-icon facebook" onclick="selectPlatform('facebook', this)" title="Facebook Download"><i class="fa-brands fa-facebook-f"></i></div>
        </div>

        <!-- Input Form -->
        <input type="text" id="mediaUrl" placeholder="TikTok ලින්ක් එක මෙතනට දාන්න...">
        <button id="downloadBtn" onclick="startDownload()">Download Now</button>

        <!-- Loading Spinner -->
        <div class="loader" id="loadingSpinner"></div>
        <div id="status"></div>
    </div>

    <script>
        let currentPlatform = 'tiktok';

        function selectPlatform(platform, element) {
            currentPlatform = platform;
            
            document.querySelectorAll('.social-icon').forEach(icon => {
                icon.classList.remove('active');
            });
            
            element.classList.add('active');

            const inputField = document.getElementById('mediaUrl');
            if (platform === 'tiktok') {
                inputField.placeholder = "TikTok ලින්ක් එක මෙතනට දාන්න...";
            } else if (platform === 'pinterest') {
                inputField.placeholder = "Pinterest ලින්ක් එක මෙතනට දාන්න...";
            } else if (platform === 'facebook') {
                inputField.placeholder = "Facebook ලින්ක් එක මෙතනට දාන්න...";
            }
            document.getElementById('status').innerText = "";
        }

        function startDownload() {
            const urlInput = document.getElementById('mediaUrl').value.trim();
            const statusDiv = document.getElementById('status');
            const spinner = document.getElementById('loadingSpinner');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!urlInput) {
                statusDiv.style.color = "#ff6b6b";
                statusDiv.innerText = "කරුණාකර ලින්ක් එකක් ඇතුළත් කරන්න!";
                return;
            }

            statusDiv.innerText = "";
            spinner.style.display = "block";
            downloadBtn.disabled = true;

            const encodedUrl = encodeURIComponent(urlInput);
            let targetUrl = "";

            // අදාළ ප්ලැට්ෆෝම් එකට අදාළ ඩවුන්ලෝඩ් പേජ් එකට ලින්ක් එක සමඟ යොමු කිරීම
            if (currentPlatform === 'tiktok') {
                targetUrl = `https://snaptik.app/en?url=${encodedUrl}`;
            } else if (currentPlatform === 'pinterest') {
                targetUrl = `https://savepin.app/download.php?url=${encodedUrl}`;
            } else if (currentPlatform === 'facebook') {
                targetUrl = `https://fdown.net/download.php?url=${encodedUrl}`;
            }

            setTimeout(() => {
                spinner.style.display = "none";
                downloadBtn.disabled = false;
                statusDiv.style.color = "#51cf66";
                statusDiv.innerText = "ඩවුන්ලෝඩ් පිටුව වෙත යොමු කරමින් පවතී...";

                // අදාළ ඩවුන්ලෝඩ් පිටුවට යැවීම
                window.location.href = targetUrl;
            }, 1000);
        }
    </script>
</body>
</html>
