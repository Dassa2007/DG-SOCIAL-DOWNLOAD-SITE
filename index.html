<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FF Lookup — Player Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg-1: #06060f;
    --accent-1: #ff2d75;
    --accent-2: #ff8a00;
    --accent-3: #7b2fff;
    --accent-4: #00e0ff;
    --text: #fff;
    --text-dim: #8b8ba7;
    --glass: rgba(255,255,255,0.045);
    --glass-border: rgba(255,255,255,0.09);
  }

  html, body { height: 100%; overflow-x: hidden; }

  body {
    font-family: 'Inter', 'Noto Sans Sinhala', system-ui, sans-serif;
    background: var(--bg-1);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* === Animated background orbs === */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
    animation: float 14s ease-in-out infinite;
  }
  body::before {
    width: 380px; height: 380px;
    background: radial-gradient(circle, #ff2d75 0%, transparent 70%);
    top: -100px; left: -100px;
  }
  body::after {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #7b2fff 0%, transparent 70%);
    bottom: -120px; right: -120px;
    animation-delay: -7s;
  }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px,-30px) scale(1.1); }
  }

  .app {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 1;
  }

  /* === Brand header === */
  .brand {
    text-align: center;
    margin-bottom: 22px;
  }

  .brand-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 62px;
    height: 62px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
    box-shadow: 0 8px 32px rgba(255,45,117,0.45);
    margin-bottom: 12px;
    animation: pulseGlow 3s ease-in-out infinite;
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1.5px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }
  .brand-logo::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    50%,100% { left: 100%; }
  }
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 8px 32px rgba(255,45,117,0.45); }
    50% { box-shadow: 0 12px 44px rgba(255,138,0,0.65); }
  }

  .brand h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff8a00, #ff2d75, #7b2fff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
    margin-bottom: 4px;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }
  .brand p {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }

  /* === Search card === */
  .search-card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .input-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .input-wrap svg.ico {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--text-dim);
    pointer-events: none;
    transition: color 0.3s;
  }
  .input-wrap:focus-within svg.ico { color: var(--accent-2); }

  #uid {
    width: 100%;
    padding: 15px 16px 15px 46px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: rgba(0,0,0,0.35);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    outline: none;
    transition: all 0.25s;
    font-family: inherit;
  }
  #uid::placeholder { color: #5a5a75; font-weight: 400; }
  #uid:focus {
    border-color: var(--accent-2);
    background: rgba(255,138,0,0.06);
    box-shadow: 0 0 0 4px rgba(255,138,0,0.12);
  }

  .search-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: inherit;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 8px 24px rgba(255,45,117,0.35);
  }
  .search-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transition: left 0.6s;
  }
  .search-btn:hover::before { left: 100%; }
  .search-btn:active { transform: scale(0.97); }
  .search-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* === Loading === */
  #loading {
    display: none;
    text-align: center;
    padding: 22px 0;
  }
  .loader {
    width: 36px; height: 36px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, var(--accent-1), var(--accent-2), transparent);
    animation: spin 0.9s linear infinite;
    position: relative;
  }
  .loader::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--bg-1);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text-dim); font-size: 13px; font-weight: 500; }

  /* === Error === */
  #error {
    display: none;
    margin-top: 14px;
    padding: 14px 16px;
    background: rgba(255,45,117,0.12);
    border: 1px solid rgba(255,45,117,0.35);
    border-radius: 12px;
    color: #ff8fa8;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* === Result === */
  #result {
    display: none;
    margin-top: 18px;
    animation: fadeUp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero {
    background: linear-gradient(145deg, rgba(123,47,255,0.18), rgba(255,45,117,0.12));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  }

  .hero-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .avatar::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent-1), var(--accent-3));
    z-index: -1;
    filter: blur(2px);
  }

  .hero-info { flex: 1; min-width: 0; }
  .hero-name {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.2px;
  }
  .hero-uid {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .hero-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: #cfcfe0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .tag.prime {
    background: linear-gradient(135deg, rgba(255,138,0,0.25), rgba(255,45,117,0.2));
    border-color: rgba(255,138,0,0.4);
    color: #ffb86b;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 4px;
  }
  .stat {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 10px 6px;
    text-align: center;
    transition: transform 0.2s, border-color 0.2s;
  }
  .stat:hover {
    transform: translateY(-2px);
    border-color: rgba(255,138,0,0.4);
  }
  .stat .label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .stat .value {
    font-size: 15px;
    font-weight: 800;
    background: linear-gradient(135deg, #ff8a00, #ff2d75);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-family: 'Orbitron', sans-serif;
  }

  .sig {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(0,0,0,0.35);
    border-left: 3px solid var(--accent-2);
    font-size: 12px;
    color: #c8c8de;
    font-style: italic;
    line-height: 1.5;
    word-break: break-word;
  }

  .rows {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 13px;
  }
  .row .row-ico {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .row .row-ico.clan {
    background: linear-gradient(135deg, rgba(123,47,255,0.35), rgba(0,224,255,0.25));
  }
  .row .row-ico.pet {
    background: linear-gradient(135deg, rgba(255,138,0,0.35), rgba(255,45,117,0.25));
  }
  .row .row-body { flex: 1; min-width: 0; }
  .row .row-title {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .row-sub {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .footer {
    margin-top: 22px;
    text-align: center;
    font-size: 10px;
    color: #4a4a66;
    letter-spacing: 0.5px;
    font-weight: 500;
  }

  @media (max-width: 360px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .hero-name { font-size: 15px; }
    .brand-logo { width: 56px; height: 56px; font-size: 23px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo">FF</div>
    <h1>FF LOOKUP</h1>
    <p>ඔබේ Free Fire UID එක ඇතුළත් කරන්න</p>
  </div>

  <!-- Search -->
  <div class="search-card">
    <div class="input-wrap">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="uid" placeholder="UID: 10496541233" inputmode="numeric" autocomplete="off">
    </div>
    <button class="search-btn" id="searchBtn">🔍 &nbsp; සොයන්න</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="loader"></div>
    <p>Player data ලෝඩ් වෙමින්...</p>
  </div>

  <!-- Error -->
  <div id="error"></div>

  <!-- Result -->
  <div id="result"></div>

  <div class="footer">
    Built with ❤️
  </div>

</div>

<script>
  // ═══════════════════════════════════════════════════════
  // 🔗 පරණ repo එකේ API URL එක මෙතන දාන්න
  // ═══════════════════════════════════════════════════════
  const API_BASE = "https://ff-lookup.vercel.app";
  // ═══════════════════════════════════════════════════════

  const btn = document.getElementById('searchBtn');
  const input = document.getElementById('uid');
  const loading = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');

  btn.addEventListener('click', search);
  input.addEventListener('keypress', e => { if (e.key === 'Enter') search(); });

  async function search() {
    const uid = input.value.trim();
    if (!/^\d{6,15}$/.test(uid)) {
      return showError('❌ UID එක අංක 6-15ක් විය යුතුය');
    }

    resultEl.style.display = 'none';
    errorEl.style.display = 'none';
    loading.style.display = 'block';
    btn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/api/ff?uid=${uid}`);
      const json = await res.json();

      if (!json.status || !json.data) {
        throw new Error(json.error || json.message || 'Player හමු නොවීය');
      }
      render(json.data, uid);
    } catch (e) {
      showError('❌ ' + e.message);
    } finally {
      loading.style.display = 'none';
      btn.disabled = false;
    }
  }

  function gradientFor(name) {
    const palettes = [
      ['#ff2d75', '#7b2fff'], ['#ff8a00', '#ff2d75'],
      ['#00e0ff', '#7b2fff'], ['#ff2d75', '#00e0ff'],
      ['#7b2fff', '#ff8a00'], ['#00e0ff', '#ff8a00'],
    ];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    const p = palettes[Math.abs(hash) % palettes.length];
    return `linear-gradient(135deg, ${p[0]}, ${p[1]})`;
  }

  function initials(name) {
    const clean = name.replace(/[^\p{L}\p{N}]/gu, '').trim();
    return (clean.slice(0, 2) || 'FF').toUpperCase();
  }

  function stripBBCode(t) {
    return String(t).replace(/\[\/?[a-z0-9=]+.*?\]/gi, '').replace(/\s+/g, ' ').trim();
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function fmtNum(n) {
    if (typeof n !== 'number') return n ?? '-';
    return n.toLocaleString('en-US');
  }

  function render(d, uid) {
    const name = d.nickname || 'Unknown';
    const grad = gradientFor(name);
    const ini = initials(name);
    const gender = (d.gender || '').replace('Gender_', '') || '-';
    const region = d.region || '-';
    const primeLvl = d.primeLevel || 0;
    const sig = d.signature ? stripBBCode(d.signature) : '';

    resultEl.innerHTML = `
      <div class="hero">
        <div class="hero-top">
          <div class="avatar" style="background:${grad}">${esc(ini)}</div>
          <div class="hero-info">
            <div class="hero-name">${esc(name)}</div>
            <div class="hero-uid">UID ${esc(uid)}</div>
            <div class="hero-tags">
              <span class="tag">${esc(gender)}</span>
              <span class="tag">${esc(region)}</span>
              ${primeLvl > 0 ? `<span class="tag prime">⭐ PRIME ${primeLvl}</span>` : ''}
            </div>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><div class="label">Level</div><div class="value">${d.level ?? '-'}</div></div>
          <div class="stat"><div class="label">BR Rank</div><div class="value">${d.rank ?? '-'}</div></div>
          <div class="stat"><div class="label">BR Pts</div><div class="value">${fmtNum(d.rankingPoints)}</div></div>
          <div class="stat"><div class="label">CS Rank</div><div class="value">${d.csRank ?? '-'}</div></div>
        </div>

        <div class="stats" style="margin-top:8px;">
          <div class="stat"><div class="label">Likes</div><div class="value">❤ ${fmtNum(d.liked)}</div></div>
          <div class="stat"><div class="label">Badges</div><div class="value">${d.badgeCount ?? 0}</div></div>
          <div class="stat"><div class="label">Created</div><div class="value" style="font-size:11px;">${esc(d.createAt ?? '-')}</div></div>
          <div class="stat"><div class="label">Login</div><div class="value" style="font-size:11px;">${esc(d.lastLogin ?? '-')}</div></div>
        </div>

        ${sig ? `<div class="sig">"${esc(sig)}"</div>` : ''}

        <div class="rows">
          ${d.clan ? `
            <div class="row">
              <div class="row-ico clan">🛡️</div>
              <div class="row-body">
                <div class="row-title">${esc(d.clan.name)}</div>
                <div class="row-sub">ID ${d.clan.id} • Level ${d.clan.level} • ${d.clan.members}/${d.clan.capacity} members</div>
              </div>
            </div>
          ` : ''}
          ${d.pet ? `
            <div class="row">
              <div class="row-ico pet">🐾</div>
              <div class="row-body">
                <div class="row-title">Pet Lv ${d.pet.level}</div>
                <div class="row-sub">Pet ID ${d.pet.id} • Exp ${fmtNum(d.pet.exp)}</div>
              </div>
            </div>
          ` : ''}
        </div>
      </div>
    `;

    resultEl.style.display = 'block';
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }
</script>

</body>
</html>
