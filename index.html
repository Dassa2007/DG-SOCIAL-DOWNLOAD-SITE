<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Video Downloader</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="py-6 text-center">
        <h1 class="text-3xl font-bold text-red-600 flex items-center justify-center gap-2">
            <i class="fa-brands fa-pinterest"></i> Pinterest Downloader
        </h1>
        <p class="text-slate-400 text-sm mt-1">Paste your Pinterest link below to download videos easily</p>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 max-w-lg mb-auto">
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            
            <!-- Input Form -->
            <div class="space-y-4">
                <div>
                    <label for="pinUrl" class="block text-sm font-medium text-slate-300 mb-1">Pinterest Video URL</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-link"></i>
                        </span>
                        <input type="text" id="pinUrl" placeholder="https://pin.it/xxxxxxx" 
                            class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-red-500 text-sm text-white placeholder-slate-500">
                    </div>
                </div>

                <button onclick="downloadVideo()" id="downloadBtn" 
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-red-600/30">
                    <i class="fa-solid fa-download"></i> Download Now
                </button>
            </div>

            <!-- Loading Spinner -->
            <div id="loading" class="hidden text-center py-6">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-red-500"></i>
                <p class="text-sm text-slate-400 mt-2">Fetching video details...</p>
            </div>

            <!-- Result Section -->
            <div id="result" class="hidden mt-6 pt-6 border-t border-slate-700 text-center">
                <h3 id="videoTitle" class="text-sm font-medium text-slate-200 mb-4 line-clamp-2"></h3>
                <div id="videoContainer" class="mb-4">
                    <!-- Video preview or download button will appear here -->
                </div>
                <a id="downloadLink" href="#" target="_blank" 
                    class="inline-flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 px-6 rounded-xl transition duration-200 text-sm w-full">
                    <i class="fa-solid fa-cloud-arrow-down"></i> Download File
                </a>
            </div>

            <!-- Error Message -->
            <div id="errorMsg" class="hidden mt-4 p-3 bg-red-900/50 border border-red-700 text-red-200 rounded-xl text-xs text-center"></div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500">
        Powered by Supun API &bull; Created for You
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const apiKey = "supun-6senhznz07sw1zzfkn8yf768";

        async function downloadVideo() {
            const urlInput = document.getElementById('pinUrl').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorMsg = document.getElementById('errorMsg');
            const downloadBtn = document.getElementById('downloadBtn');

            // Reset UI
            result.classList.add('hidden');
            errorMsg.classList.add('hidden');

            if (!urlInput) {
                showError("කරුණාකර Pinterest ලින්ක් එකක් ඇතුළත් කරන්න!");
                return;
            }

            loading.classList.remove('hidden');
            downloadBtn.disabled = true;

            try {
                const apiEndpoint = `https://supunofc.site/api/download/down/pin/dl?url=${encodeURIComponent(urlInput)}&apikey=${apiKey}`;
                
                const response = await fetch(apiEndpoint);
                const data = await response.json();

                // මෙය බ්‍රව්සර් එකේ F12 Console එකේ පෙන්වනු ඇත
                console.log("API Response Data:", data);

                loading.classList.add('hidden');
                downloadBtn.disabled = false;

                // API එකෙන් එන විවිධ format පරීක්ෂා කිරීම
                const downloadUrl = data.url || data.download || data.result || (data.data && data.data.url) || (data.result && data.result.url);
                const title = data.title || data.caption || data.note || "Pinterest Video";

                if (downloadUrl) {
                    document.getElementById('videoTitle').innerText = title;
                    document.getElementById('downloadLink').href = downloadUrl;
                    result.classList.remove('hidden');
                } else {
                    showError("වීඩියෝ ලින්ක් එක ලබාගැනීමට නොහැකි විය. (API Response Format Error)");
                }

            } catch (err) {
                loading.classList.add('hidden');
                downloadBtn.disabled = false;
                showError("සමාවන්න, දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.");
                console.error(err);
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = message;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
