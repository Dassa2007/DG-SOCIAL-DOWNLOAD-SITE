<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0c1b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1a1528;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #a855f7;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #332952;
            background: #110d1d;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #a855f7;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #result {
            margin-top: 20px;
            background: #110d1d;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #332952;
            word-break: break-all;
            display: none;
        }
        .loading {
            text-align: center;
            color: #a855f7;
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube Downloader</h2>
    <div class="form-group">
        <label for="videoUrl">YouTube Video URL</label>
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
    </div>
    
    <div class="form-group">
        <label for="quality">Quality</label>
        <select id="quality">
            <option value="1080p">1080p FHD</option>
            <option value="720p">720p HD</option>
        </select>
    </div>

    <button onclick="downloadVideo()">Send Request</button>

    <div class="loading" id="loadingText">Processing, please wait...</div>
    <div id="result"></div>
</div>

<script>
    async function downloadVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        const quality = document.getElementById('quality').value;
        const resultDiv = document.getElementById('result');
        const loadingText = document.getElementById('loadingText');

        if (!url) {
            alert('කරුණාකර YouTube Link එකක් ඇතුළත් කරන්න!');
            return;
        }

        // ඔබේ API Key එක මෙහි ඇතුළත් කර ඇත
        const apiKey = "chama_api_5a41a37af1494e56bc697d3122bd519a"; 
        
        const apiUrl = `https://api.chamindu.site/api/v1/youtube/mp4?url=${encodeURIComponent(url)}&quality=${quality}&api_key=${apiKey}`;

        resultDiv.style.display = 'none';
        loadingText.style.display = 'block';

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            loadingText.style.display = 'none';
            resultDiv.style.display = 'block';

            if (response.ok) {
                resultDiv.innerHTML = `<strong>Success!</strong><br><a href="${data.url || data.download_url || '#'}" target="_blank" style="color: #38bdf8;">Download Link Click Here</a>`;
            } else {
                resultDiv.innerHTML = `<span style="color: #f87171;">Error: ${data.message || 'Something went wrong!'}</span>`;
            }
        } catch (error) {
            loadingText.style.display = 'none';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<span style="color: #f87171;">Connection Error: ${error.message}</span>`;
        }
    }
</script>

</body>
</html>
