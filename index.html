<!DOCTYPE html>
<html lang="si" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DG Social Downloader — TikTok · Pinterest · Facebook</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        /* ─── CSS VARIABLES (Dark / Light) ─── */
        :root {
            --bg-primary: #08080e;
            --bg-secondary: rgba(255, 255, 255, 0.03);
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-input: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(255, 70, 120, 0.25);
            --text-primary: #f0edff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-muted: rgba(255, 255, 255, 0.25);
            --text-placeholder: rgba(255, 255, 255, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.7);
            --accent-tiktok: #fe2c55;
            --accent-facebook: #1877f2;
            --accent-pinterest: #e60023;
            --btn-gradient: linear-gradient(135deg, #f9416b, #d61a4e);
            --btn-shadow: rgba(249, 65, 107, 0.35);
            --result-bg: rgba(0, 0, 0, 0.3);
            --footer-color: rgba(255, 255, 255, 0.08);
            --scrollbar-track: rgba(255, 255, 255, 0.02);
            --scrollbar-thumb: rgba(255, 255, 255, 0.08);
            --tab-bg: rgba(255, 255, 255, 0.03);
            --tab-active: rgba(255, 255, 255, 0.07);
            --tab-hover: rgba(255, 255, 255, 0.05);
            --option-bg: rgba(255, 255, 255, 0.03);
            --option-hover: rgba(249, 65, 107, 0.06);
            --badge-bg: rgba(249, 65, 107, 0.10);
            --badge-color: #ff8aa8;
            --error-bg: rgba(248, 113, 113, 0.07);
            --error-border: rgba(248, 113, 113, 0.10);
            --error-color: #f87171;
            --success-color: #34d399;
            --toggle-bg: rgba(255, 255, 255, 0.08);
            --toggle-dot: #f0edff;
            --input-border: rgba(255, 255, 255, 0.08);
            --whatsapp-bg: #25d366;
            --whatsapp-hover: #1ebe5c;
            --audio-bg: rgba(37, 244, 238, 0.08);
            --audio-border: rgba(37, 244, 238, 0.15);
            --audio-color: #25f4ee;
            --hd-color: #22c55e;
            --sd-color: #eab308;
        }

        [data-theme="light"] {
            --bg-primary: #f4f2f7;
            --bg-secondary: rgba(255, 255, 255, 0.6);
            --bg-card: rgba(255, 255, 255, 0.5);
            --bg-input: rgba(0, 0, 0, 0.04);
            --border-color: rgba(0, 0, 0, 0.06);
            --border-focus: rgba(230, 0, 35, 0.2);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0, 0, 0, 0.5);
            --text-muted: rgba(0, 0, 0, 0.3);
            --text-placeholder: rgba(0, 0, 0, 0.2);
            --shadow-color: rgba(0, 0, 0, 0.12);
            --btn-gradient: linear-gradient(135deg, #e60023, #b3001b);
            --btn-shadow: rgba(230, 0, 35, 0.25);
            --result-bg: rgba(0, 0, 0, 0.04);
            --footer-color: rgba(0, 0, 0, 0.06);
            --scrollbar-track: rgba(0, 0, 0, 0.02);
            --scrollbar-thumb: rgba(0, 0, 0, 0.08);
            --tab-bg: rgba(0, 0, 0, 0.03);
            --tab-active: rgba(0, 0, 0, 0.05);
            --tab-hover: rgba(0, 0, 0, 0.04);
            --option-bg: rgba(0, 0, 0, 0.03);
            --option-hover: rgba(230, 0, 35, 0.05);
            --badge-bg: rgba(230, 0, 35, 0.08);
            --badge-color: #b3001b;
            --error-bg: rgba(220, 38, 38, 0.06);
            --error-border: rgba(220, 38, 38, 0.10);
            --error-color: #dc2626;
            --success-color: #059669;
            --toggle-bg: rgba(0, 0, 0, 0.12);
            --toggle-dot: #fff;
            --input-border: rgba(0, 0, 0, 0.08);
            --whatsapp-bg: #25d366;
            --whatsapp-hover: #1ebe5c;
            --audio-bg: rgba(37, 244, 238, 0.06);
            --audio-border: rgba(37, 244, 238, 0.12);
            --audio-color: #0ea5e9;
        }

        /* ─── RESET ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 20px;
            transition: background 0.4s ease, color 0.4s ease;
            position: relative;
        }

        /* ─── BACKGROUND ORBS ─── */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: background 0.6s ease;
        }
        body::before {
            top: -20%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 70, 120, 0.12) 0%, transparent 70%);
            animation: floatOrb 18s ease-in-out infinite alternate;
        }
        body::after {
            bottom: -20%;
            left: -10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.08) 0%, transparent 70%);
            animation: floatOrb 22s ease-in-out infinite alternate-reverse;
        }
        [data-theme="light"] body::before {
            background: radial-gradient(circle, rgba(230, 0, 35, 0.08) 0%, transparent 70%);
        }
        [data-theme="light"] body::after {
            background: radial-gradient(circle, rgba(24, 119, 242, 0.06) 0%, transparent 70%);
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.2);
            }
        }

        /* ─── MAIN CARD ─── */
        .container {
            max-width: 820px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-color);
            border-radius: 44px;
            padding: 28px 36px 28px;
            box-shadow: 0 40px 100px var(--shadow-color), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* ─── TOP BAR ─── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 12px;
        }

        .top-bar .left-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: auto;
        }

        .top-bar .brand-tag {
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            opacity: 0.5;
        }

        .top-btn {
            background: var(--bg-input);
            border: 1px solid var(--input-border);
            color: var(--text-secondary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            font-size: 1.1rem;
            position: relative;
        }

        .top-btn:hover {
            background: var(--tab-hover);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .top-btn:active {
            transform: scale(0.92);
        }

        /* ─── THEME TOGGLE ─── */
        .theme-toggle {
            width: 52px;
            border-radius: 40px;
            background: var(--toggle-bg);
            border: 1px solid var(--input-border);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: background 0.3s ease, border-color 0.3s ease;
            flex-shrink: 0;
            height: 34px;
            position: relative;
        }

        .theme-toggle .dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--toggle-dot);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--bg-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .theme-toggle.light .dot {
            transform: translateX(18px);
            background: #fff;
        }

        .theme-toggle.dark .dot {
            transform: translateX(0);
            background: #f0edff;
        }

        /* ─── HEADER ─── */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header h1 .dg {
            background: linear-gradient(135deg, #f9e8ff 0%, #ffa8c5 40%, #ff7b9c 70%, #f9416b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h1 .social-icon {
            -webkit-text-fill-color: initial;
        }

        .header h1 .social-icon.tiktok {
            color: #fe2c55;
        }
        .header h1 .social-icon.facebook {
            color: #1877f2;
        }
        .header h1 .social-icon.pinterest {
            color: #e60023;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 6px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        /* ─── TABS ─── */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 28px;
            background: var(--tab-bg);
            border-radius: 18px;
            padding: 6px;
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, border-color 0.3s ease;
            overflow-x: auto;
            flex-wrap: nowrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
            position: relative;
        }

        .tab-btn i {
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .tab-btn:hover {
            background: var(--tab-hover);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--tab-active);
            color: var(--text-primary);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .tab-btn.active.tab-tiktok i {
            color: #fe2c55;
        }
        .tab-btn.active.tab-facebook i {
            color: #1877f2;
        }
        .tab-btn.active.tab-pinterest i {
            color: #e60023;
        }

        .tab-btn .tab-label {
            display: inline;
        }

        /* ─── TAB CONTENT ─── */
        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(12px) scale(0.97);
            animation: none;
        }

        .tab-content.active {
            display: block;
            animation: tabPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes tabPop {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ─── URL FIELD ─── */
        .url-field {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            padding: 4px 6px 4px 16px;
            margin-bottom: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .url-field:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(249, 65, 107, 0.04), inset 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .url-field .platform-icon {
            font-size: 0.95rem;
            opacity: 0.5;
            transition: opacity 0.3s ease;
            width: 18px;
            text-align: center;
        }

        .url-field .platform-icon.tiktok-icon {
            color: #fe2c55;
        }
        .url-field .platform-icon.facebook-icon {
            color: #1877f2;
        }
        .url-field .platform-icon.pinterest-icon {
            color: #e60023;
        }

        .url-field input {
            flex: 1;
            padding: 13px 4px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.92rem;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            min-width: 0;
            transition: color 0.3s ease;
        }

        .url-field input::placeholder {
            color: var(--text-placeholder);
            font-weight: 400;
        }

        .url-field .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: color 0.2s;
            border-radius: 40px;
        }

        .url-field .clear-btn:hover {
            color: var(--text-secondary);
        }

        /* ─── TIKTOK OPTIONS ─── */
        .tiktok-options {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            background: var(--bg-input);
            padding: 8px 14px;
            border-radius: 60px;
            border: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }

        .tiktok-options .option-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }

        .tiktok-options .option-label i {
            opacity: 0.6;
        }

        .tiktok-options .radio-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tiktok-options .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 40px;
            background: var(--option-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s, color 0.25s, transform 0.2s;
        }

        .tiktok-options .radio-group label:hover {
            background: var(--tab-hover);
            transform: scale(1.02);
        }

        .tiktok-options .radio-group label.active-option {
            background: var(--audio-bg);
            border-color: var(--audio-border);
            color: var(--audio-color);
        }

        .tiktok-options .radio-group label i {
            font-size: 0.8rem;
        }

        .tiktok-options .radio-group input[type="radio"] {
            display: none;
        }

        /* ─── DOWNLOAD BUTTON ─── */
        .download-btn-main {
            width: 100%;
            padding: 16px;
            background: var(--btn-gradient);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.3s ease;
            box-shadow: 0 8px 28px var(--btn-shadow);
            margin-bottom: 6px;
            position: relative;
            overflow: hidden;
        }

        .download-btn-main:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 14px 40px var(--btn-shadow);
            filter: brightness(1.05);
        }

        .download-btn-main:active {
            transform: scale(0.97);
            box-shadow: 0 4px 16px var(--btn-shadow);
        }

        .download-btn-main i {
            font-size: 1.1rem;
        }

        /* ─── LOADING ─── */
        .loading {
            display: none;
            text-align: center;
            padding: 28px 0 18px;
        }

        .spinner {
            width: 46px;
            height: 46px;
            margin: 0 auto;
            border: 3px solid rgba(249, 65, 107, 0.10);
            border-top: 3px solid #f9416b;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 14px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        /* ─── ERROR ─── */
        .error-msg {
            color: var(--error-color);
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            padding: 14px 20px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
            margin: 8px 0 4px;
            text-align: center;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        /* ─── RESULT BOX ─── */
        .result-box {
            display: none;
            margin-top: 26px;
            background: var(--result-bg);
            border-radius: 24px;
            padding: 24px 24px 18px;
            border: 1px solid var(--border-color);
            animation: fadeUp 0.5s ease;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .result-box .result-title {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s ease;
        }

        .result-box .result-title i {
            color: var(--success-color);
        }

        .result-item {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .result-item .url-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 400;
            margin-bottom: 12px;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s ease;
        }

        .result-item .url-label i {
            opacity: 0.6;
        }
        .result-item .url-label i.tiktok-label {
            color: #fe2c55;
        }
        .result-item .url-label i.facebook-label {
            color: #1877f2;
        }
        .result-item .url-label i.pinterest-label {
            color: #e60023;
        }

        .quality-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 14px 24px;
            background: var(--option-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background 0.25s ease, transform 0.2s ease, border-color 0.25s ease, color 0.3s ease;
            cursor: pointer;
        }

        .download-btn:hover {
            background: var(--option-hover);
            border-color: rgba(249, 65, 107, 0.15);
            transform: translateX(5px);
        }

        .download-btn span:first-child {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .download-btn span:first-child i {
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }

        .download-btn .quality-badge {
            background: var(--badge-bg);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--badge-color);
            letter-spacing: 0.3px;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .download-btn:hover .quality-badge {
            background: rgba(249, 65, 107, 0.18);
            color: var(--badge-color);
        }

        /* ─── SPECIFIC DOWNLOAD BUTTON STYLES ─── */
        .download-btn.hd-download {
            border-color: rgba(34, 197, 94, 0.2);
            background: rgba(34, 197, 94, 0.05);
        }
        .download-btn.hd-download:hover {
            border-color: rgba(34, 197, 94, 0.4);
            background: rgba(34, 197, 94, 0.08);
        }
        .download-btn.hd-download span:first-child i {
            color: #22c55e;
        }

        .download-btn.sd-download {
            border-color: rgba(234, 179, 8, 0.2);
            background: rgba(234, 179, 8, 0.05);
        }
        .download-btn.sd-download:hover {
            border-color: rgba(234, 179, 8, 0.4);
            background: rgba(234, 179, 8, 0.08);
        }
        .download-btn.sd-download span:first-child i {
            color: #eab308;
        }

        .download-btn.audio-download {
            border-color: rgba(236, 72, 153, 0.2);
            background: rgba(236, 72, 153, 0.05);
        }
        .download-btn.audio-download:hover {
            border-color: rgba(236, 72, 153, 0.4);
            background: rgba(236, 72, 153, 0.08);
        }
        .download-btn.audio-download span:first-child i {
            color: #ec4899;
        }

        .no-quality {
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 8px 0;
            transition: color 0.3s ease;
        }

    <script>
        // ════════════════════════════════════════════════════════════════
        // 1. THEME TOGGLE
        // ════════════════════════════════════════════════════════════════

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        let currentTheme = 'dark';

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'light') {
                themeToggle.classList.remove('dark');
                themeToggle.classList.add('light');
                themeIcon.className = 'fas fa-sun';
            } else {
                themeToggle.classList.remove('light');
                themeToggle.classList.add('dark');
                themeIcon.className = 'fas fa-moon';
            }
            localStorage.setItem('dg-theme', theme);
        }

        themeToggle.addEventListener('click', () => {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        const savedTheme = localStorage.getItem('dg-theme') || 'dark';
        setTheme(savedTheme);

        // ════════════════════════════════════════════════════════════════
        // 2. TAB SWITCHING
        // ════════════════════════════════════════════════════════════════

        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = {
            tiktok: document.getElementById('tab-tiktok'),
            facebook: document.getElementById('tab-facebook'),
            pinterest: document.getElementById('tab-pinterest'),
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;

                Object.keys(tabContents).forEach(key => {
                    const el = tabContents[key];
                    el.classList.remove('active');
                    el.style.display = 'none';
                });

                const activeEl = tabContents[tab];
                activeEl.style.display = 'block';
                void activeEl.offsetWidth;
                activeEl.classList.add('active');

                const resultBox = document.getElementById(`result${capitalize(tab)}`);
                if (resultBox) resultBox.style.display = 'none';
                const errorMsg = document.getElementById(`error${capitalize(tab)}`);
                if (errorMsg) errorMsg.style.display = 'none';

                const input = document.getElementById(`urlInput${capitalize(tab)}`);
                if (input) setTimeout(() => input.focus(), 150);
            });
        });

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // ════════════════════════════════════════════════════════════════
        // 3. TIKTOK OPTIONS UI
        // ════════════════════════════════════════════════════════════════

        document.querySelectorAll('#tiktokOptions .radio-group label').forEach(label => {
            label.addEventListener('click', function() {
                const parent = this.closest('.radio-group');
                parent.querySelectorAll('label').forEach(l => l.classList.remove('active-option'));
                this.classList.add('active-option');
                const radio = this.querySelector('input[type="radio"]');
                if (radio) radio.checked = true;
            });
        });

        function getTikTokMode() {
            const selected = document.querySelector('#tiktokOptions input[name="tiktokMode"]:checked');
            return selected ? selected.value : 'video_audio';
        }

        // ════════════════════════════════════════════════════════════════

                    console.log('Pinterest API response:', data);

            const input = document.getElementById('urlInputTiktok');
            const url = input.value.trim();

            const errorMsg = document.getElementById('errorTiktok');
            const qualityContainer = document.getElementById('qualityOptionsTiktok');

            resultBox.style.display = 'none';
            errorMsg.style.display = 'none';
            qualityContainer.innerHTML = '';
            loading.style.display = 'block';

            if (!url) {
                loading.style.display = 'none';
                errorMsg.innerText = 'Please paste a TikTok video URL!';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const apiUrl = `${TIKTOK_AUDIO_API}/api/download/tiktok`;
                console.log('TikTok API request (POST):', apiUrl);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();
                console.log('TikTok API response:', data);

                loading.style.display = 'none';

                if (data.success && data.data) {
                    const videoData = data.data;
                    const items = [];

                    if (mode === 'video_audio' || mode === 'video_only') {
                        if (videoData.videoHD) {
                            items.push({
                                label: 'HD Video',
                                url: videoData.videoHD,
                                filename: 'tiktok-hd.mp4',
                                cssClass: 'hd-download',
                                icon: 'fa-video',
                                type: 'video'
                            });
                        }
                        if (videoData.videoNormal) {
                            items.push({
                                label: 'SD Video',
                                url: videoData.videoNormal,
                                filename: 'tiktok-sd.mp4',
                                cssClass: 'sd-download',
                                icon: 'fa-video',
                                type: 'video'
                            });
                        }
                    }

                    if (mode === 'video_audio' || mode === 'audio_only') {
                        if (videoData.audioUrl) {
                            items.push({
                                label: 'Audio Only (MP3)',
                                url: videoData.audioUrl,
                                filename: 'tiktok-audio.mp3',
                                cssClass: 'audio-download',
                                icon: 'fa-music',
                                type: 'audio'
                            });
                        }
                    }

                    if (items.length === 0) {
                        errorMsg.innerText = 'No download options available for this video.';
                        errorMsg.style.display = 'block';
                        return;
                    }

                    let html = `<div class="result-item">`;
                    html += `<div class="url-label"><i class="fab fa-tiktok tiktok-label"></i> TikTok ready</div>`;
                    html += `<div class="quality-options">`;

                    for (const item of items) {
                        const proxyUrl = `${TIKTOK_AUDIO_API}/api/proxy-download?url=${encodeURIComponent(item.url)}&type=${item.type === 'audio' ? 'audio' : 'video'}`;
                        const isAudio = item.type === 'audio';

                        html += `
                            <div style="display:flex; gap:8px; align-items:center; width:100%;">
                                <a href="${proxyUrl}" class="download-btn ${item.cssClass}" download="${item.filename}" style="flex:1;">
                                    <span><i class="fas ${item.icon}"></i> ${item.label}</span>
                                    <span class="quality-badge"><i class="fas fa-download"></i> Download</span>
                                </a>
                                <button class="play-btn" onclick="${isAudio ? `playAudio('${proxyUrl}')` : `playVideo('${proxyUrl}')`}" title="Play in popup">
                                    <i class="fas fa-play"></i>
                                </button>
                            </div>
                        `;
                    }

                    html += `</div></div>`;
                    qualityContainer.innerHTML = html;
                    resultBox.style.display = 'block';
                    showToast('✅ TikTok video ready!', 'success');

                } else {
                    const msg = data.error || data.message || 'Could not fetch TikTok video.';
                    errorMsg.innerText = msg;
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                console.error('TikTok download error:', error);
                loading.style.display = 'none';
                errorMsg.innerText = 'Connection error. Please try again! (Free servers may take 30–40s to wake up.)';
                errorMsg.style.display = 'block';
                showToast('⚠️ Connection error. Retry in a moment.', 'error');
            }
        }

        // ════════════════════════════════════════════════════════════════
        // 7. FACEBOOK & PINTEREST DOWNLOAD (with Play buttons)
        // ════════════════════════════════════════════════════════════════

        async function downloadVideos(platform) {
            const cap = capitalize(platform);
            const input = document.getElementById(`urlInput${cap}`);
            const url = input.value.trim();

            const loading = document.getElementById(`loading${cap}`);
            const resultBox = document.getElementById(`result${cap}`);
            const errorMsg = document.getElementById(`error${cap}`);
            const qualityContainer = document.getElementById(`qualityOptions${cap}`);

            resultBox.style.display = 'none';
            errorMsg.style.display = 'none';
            qualityContainer.innerHTML = '';
            loading.style.display = 'block';

            if (!url) {
                loading.style.display = 'none';
                errorMsg.innerText = 'Please paste a video URL!';
                errorMsg.style.display = 'block';
                return;
            }

            const config = API_CONFIG[platform];
            if (!config) {
                loading.style.display = 'none';
                errorMsg.innerText = 'Platform not supported.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const apiURL = `${config.url}?url=${encodeURIComponent(url)}`;
                console.log(`Fetching ${platform} from:`, apiURL);
                const response = await fetch(apiURL);
                const data = await response.json();

                loading.style.display = 'none';

                const parsed = config.parse(data);
                if (parsed && parsed.length > 0) {
                    const iconClass = config.icon || 'fas fa-link';
                    let html = `<div class="result-item">`;
                    html += `<div class="url-label"><i class="${iconClass}"></i> Video ready</div>`;
                    html += `<div class="quality-options">`;
                    for (const item of parsed) {
                        const proxyUrl = `${config.proxy}?url=${encodeURIComponent(item.url)}`;
                        const filename = `${platform}-${item.label.toLowerCase().replace(/\s+/g, '-')}.mp4`;
                        const cssClass = item.cssClass || 'hd-download';

                        html += `
                            <div style="display:flex; gap:8px; align-items:center; width:100%;">
                                <a href="${proxyUrl}" class="download-btn ${cssClass}" download="${filename}" style="flex:1;">
                                    <span><i class="fas fa-video"></i> ${item.label}</span>
                                    <span class="quality-badge"><i class="fas fa-download"></i> Download</span>
                                </a>
                                <button class="play-btn" onclick="playVideo('${proxyUrl}')" title="Play in popup">
                                    <i class="fas fa-play"></i>
                                </button>
                            </div>
                        `;
                    }
                    html += `</div></div>`;
                    qualityContainer.innerHTML = html;
                    resultBox.style.display = 'block';
                    showToast(`✅ ${cap} video ready!`, 'success');
                } else {
                    const msg = data.message || config.errorMsg(data) || 'No video found.';
                    errorMsg.innerText = msg;
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                console.error('Download function error:', error);
                loading.style.display = 'none';
                errorMsg.innerText = 'Connection error. Please try again! (Free servers may take 30–40s to wake up.)';
                errorMsg.style.display = 'block';
                showToast('⚠️ Connection error. Retry in a moment.', 'error');
            }
        }

        // ════════════════════════════════════════════════════════════════
        // 8. TOAST
        // ════════════════════════════════════════════════════════════════

        let toastTimeout = null;

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const icon = toast.querySelector('i');

            toast.className = 'toast';
            if (type === 'success') {
                toast.classList.add('success');
                icon.className = 'fas fa-circle-check';
            } else if (type === 'error') {
                toast.classList.add('error');
                icon.className = 'fas fa-circle-xmark';
            } else {
                toast.classList.add('info');
                icon.className = 'fas fa-circle-info';
            }

            toastMsg.textContent = msg;
            toast.classList.add('show');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ════════════════════════════════════════════════════════════════
        // 9. KEYBOARD SHORTCUT: Enter to download
        // ════════════════════════════════════════════════════════════════

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const activeTab = document.querySelector('.tab-btn.active');
                if (activeTab) {
                    const platform = activeTab.dataset.tab;
                    if (platform === 'tiktok') {
                        downloadTikTok();
                    } else {
                        downloadVideos(platform);
                    }
                }
            }
        });

        // ════════════════════════════════════════════════════════════════
        // 10. INITIAL FOCUS
        // ════════════════════════════════════════════════════════════════

        setTimeout(() => {
            const firstInput = document.getElementById('urlInputTiktok');
            if (firstInput) firstInput.focus();
        }, 300);

        console.log('🚀 DG Social Downloader v6 — with Play Popups');
        console.log('📌 Video & Audio popups auto-close in 60 seconds.');
        console.log('🎨 Audio player uses custom background image.');
    </script>

</body>
</html>
