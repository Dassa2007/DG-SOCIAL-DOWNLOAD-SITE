<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Video Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2563eb;
        }
        .result {
            margin-top: 15px;
            word-break: break-all;
        }
        .video-info {
            background: #0f172a;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            text-align: left;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>FB Video Downloader</h2>
        <p>Paste your Facebook video link below:</p>
        <input type="text" id="videoUrl" placeholder="https://www.facebook.com/..." />
        <button onclick="downloadVideo()">Download</button>
        
        <div class="result" id="resultArea"></div>
    </div>

    <script>
        async function downloadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const resultArea = document.getElementById('resultArea');
            
            if (!urlInput) {
                resultArea.innerHTML = "<p style='color: red;'>කරුණාකර ලින්ක් එකක් ඇතුළත් කරන්න!</p>";
                return;
            }

            resultArea.innerHTML = "Processing...";

            const apiKey = "kcey_3aac11b6ed5c49a5b3b0a2a2922a38de4014";
            const apiUrl = `https://api.kcey.online/api/facebook?url=${encodeURIComponent(urlInput)}&key=${apiKey}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                // කෝඩ් එකේ වැඩ කටයුතු පරීක්ෂා කිරීමට Console එකට දමයි
                console.log("API Response:", data);

                // විවිධ තත්වයන් යටතේ ලින්ක් එක ලබා ගැනීමට උත්සාහ කරයි
                let videoDownloadUrl = null;

                if (data) {
                    if (data.url) {
                        videoDownloadUrl = data.url;
                    } else if (data.data && data.data.url) {
                        videoDownloadUrl = data.data.url;
                    } else if (Array.isArray(data) && data.length > 0) {
                        videoDownloadUrl = data[0].url;
                    }
                }

                if(videoDownloadUrl) {
                    resultArea.innerHTML = `
                        <p style='color: #22c55e; font-weight: bold;'>සාර්ථකයි! වීඩියෝව සූදානම්:</p>
                        <br>
                        <a href="${videoDownloadUrl}" target="_blank" style="background: #22c55e; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; display: block; font-weight: bold;" download>Download Video</a>`;
                } else {
                    // API එකෙන් ලින්ක් එක නොපැමිණියේ නම් සම්පූර්ණ JSON එක තිරයේ පෙන්වයි
                    resultArea.innerHTML = `<p style='color: orange; font-size: 12px;'>ලින්ක් එක සෘජුව ලබා ගැනීමට නොහැකි විය. ලැබුණු දත්ත: <br> ${JSON.stringify(data)}</p>`;
                }
            } catch (error) {
                resultArea.innerHTML = "<p style='color: red;'>දෝෂයක් සිදු විය (CORS හෝ Network ගැටළුවක් විය හැක): " + error.message + "</p>";
            }
        }
    </script>


</body>
</html>
