<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Downloader - MP3 / MP4</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
  }

  .container {
    width: 100%;
    max-width: 560px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #ff0000, #ff4d4d);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 8px 20px rgba(255, 0, 0, 0.4);
  }

  .header h1 {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(90deg, #fff, #b8b8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header p {
    font-size: 13px;
    color: #9ca3af;
    margin-top: 6px;
  }

  .input-group {
    position: relative;
    margin-bottom: 16px;
  }

  .input-group input {
    width: 100%;
    padding: 16px 18px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: 0.25s;
  }

  .input-group input::placeholder {
    color: #6b7280;
  }

  .input-group input:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
  }

  .tabs {
    display: flex;
    gap: 8px;
    background: rgba(0, 0, 0, 0.25);
    padding: 6px;
    border-radius: 14px;
    margin-bottom: 16px;
  }

  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    color: #9ca3af;
    transition: 0.25s;
    user-select: none;
  }

  .tab.active {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: #fff;
    box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
  }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    transition: 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(139, 92, 246, 0.5);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .loader {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .result {
    margin-top: 20px;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 16px;
  }

  .video-info {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-bottom: 16px;
  }

  .video-info img {
    width: 100px;
    height: 62px;
    border-radius: 10px;
    object-fit: cover;
    background: #111;
  }

  .video-meta h3 {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .video-meta span {
    font-size: 12px;
    color: #9ca3af;
    display: block;
    margin-top: 4px;
  }

  .download-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    transition: 0.25s;
  }

  .download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(16, 185, 129, 0.45);
  }

  .error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 14px;
    border-radius: 12px;
    font-size: 13px;
    text-align: center;
    margin-top: 16px;
  }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: #6b7280;
  }

  .footer a {
    color: #a78bfa;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">▶</div>
      <h1>YT Downloader</h1>
    </div>
    <p>YouTube videos ලේසියෙන්ම MP3 / MP4 බාගන්න</p>
  </div>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="YouTube video link මෙතන paste කරන්න..." />
  </div>

  <div class="tabs">
    <div class="tab active" data-type="mp3">🎵 MP3</div>
    <div class="tab" data-type="mp4">🎬 MP4</div>
  </div>

  <button class="btn" id="downloadBtn">
    <span id="btnText">Download කරන්න</span>
  </button>

  <div class="result" id="result"></div>

  <div class="footer">
    Powered by <a href="https://multidl.kcey.workers.dev" target="_blank">Multi Downloader API</a>
  </div>
</div>

<script>
  const API_BASE = "https://multidl.kcey.workers.dev";
  const urlInput = document.getElementById("urlInput");
  const downloadBtn = document.getElementById("downloadBtn");
  const btnText = document.getElementById("btnText");
  const resultBox = document.getElementById("result");
  let selectedType = "mp3";

  // Tab switching
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      selectedType = tab.dataset.type;
    });
  });

  // Extract YouTube video ID
  function getVideoId(url) {
    const patterns = [
      /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  // Show error
  function showError(msg) {
    resultBox.style.display = "block";
    resultBox.innerHTML = `<div class="error">⚠️ ${msg}</div>`;
  }

  // Show loading
  function setLoading(loading) {
    if (loading) {
      downloadBtn.disabled = true;
      btnText.innerHTML = '<span class="loader"></span> බාගනිමින්...';
    } else {
      downloadBtn.disabled = false;
      btnText.textContent = "Download කරන්න";
    }
  }

  // Main download logic
  async function handleDownload() {
    const url = urlInput.value.trim();
    resultBox.style.display = "none";
    resultBox.innerHTML = "";

    if (!url) {
      showError("කරුණාකර YouTube link එකක් paste කරන්න.");
      return;
    }

    const videoId = getVideoId(url);
    if (!videoId) {
      showError("වලංගු YouTube link එකක් නෙවෙයි. කරුණාකර නැවත උත්සාහ කරන්න.");
      return;
    }

    setLoading(true);

    try {
      // Try common endpoint patterns
      const endpoints = [
        `${API_BASE}/youtube?url=${encodeURIComponent(url)}&type=${selectedType}`,
        `${API_BASE}/yt?url=${encodeURIComponent(url)}&type=${selectedType}`,
        `${API_BASE}/download?url=${encodeURIComponent(url)}&type=${selectedType}`,
        `${API_BASE}/api/youtube?url=${encodeURIComponent(url)}&format=${selectedType}`
      ];

      let data = null;
      let lastError = null;

      for (const endpoint of endpoints) {
        try {
          const res = await fetch(endpoint);
          if (!res.ok) continue;
          const json = await res.json();
          if (json && (json.url || json.download || json.link || json.data)) {
            data = json;
            break;
          }
          if (!lastError) lastError = json;
        } catch (e) {
          lastError = e;
        }
      }

      if (!data) {
        throw new Error("API එකෙන් ප්‍රතිචාරයක් ලැබුණේ නැහැ. Endpoint එක වෙනස් විය හැක.");
      }

      // Parse response flexibly
      const payload = data.data || data;
      const downloadUrl =
        payload.url ||
        payload.download ||
        payload.link ||
        payload.downloadUrl ||
        payload.audio ||
        payload.video ||
        (payload.formats && payload.formats[0] && payload.formats[0].url);

      const title = payload.title || "YouTube Video";
      const thumb = payload.thumbnail || `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`;
      const author = payload.author || payload.channel || "";

      if (!downloadUrl) {
        throw new Error("Download link එක හමු නොවුණා. API response එක වෙනස් විය හැක.");
      }

      // Render result
      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <div class="card">
          <div class="video-info">
            <img src="${thumb}" alt="thumbnail" onerror="this.src='https://i.ytimg.com/vi/${videoId}/mqdefault.jpg'"/>
            <div class="video-meta">
              <h3>${escapeHtml(title)}</h3>
              <span>${escapeHtml(author)} • ${selectedType.toUpperCase()}</span>
            </div>
          </div>
          <a class="download-btn" href="${downloadUrl}" target="_blank" rel="noopener" download>
            ⬇ ${selectedType.toUpperCase()} බාගන්න
          </a>
        </div>
      `;

    } catch (err) {
      console.error(err);
      showError(err.message || "Download කිරීමේ දෝෂයක්. නැවත උත්සාහ කරන්න.");
    } finally {
      setLoading(false);
    }
  }

  // Basic HTML escape
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Events
  downloadBtn.addEventListener("click", handleDownload);
  urlInput.addEventListener("keydown", e => {
    if (e.key === "Enter") handleDownload();
  });
</script>

</body>
</html>
